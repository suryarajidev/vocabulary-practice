<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Practice</title>
<style>
  :root {
    --bg: #f0ebdd;
    --text: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #fdfcf9;
    --border: #e5e1d3;
    --accent: #2563eb;
    --teal: #0d9488;
    --good: #16a34a;
    --almost: #b45309;
    --bad: #dc2626;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: auto;
  }

  .tabs {
    width: 100%;
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  .practice-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .side-toggle {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .side-toggle-btn {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }

  .side-toggle-btn.active {
    background: var(--teal);
    color: white;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 13px;
    color: var(--muted);
    align-self: center;
  }

  .card-scene {
    width: 100%;
    min-height: 280px;
    perspective: 1200px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 280px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }

  .card-inner.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    backface-visibility: hidden;
    user-select: none;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    border-top: 4px solid transparent;
  }

  .card-front {
    background: var(--card-bg);
    border-top-color: var(--accent);
  }

  .card-back {
    background: #e6f7f3;
    border-top-color: var(--teal);
    transform: rotateY(180deg);
  }

  .side-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .word {
    font-size: 32px;
    font-weight: 700;
  }

  .definition {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.4;
  }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
  }

  .rate-row {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  .rate-row button {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .dont-know {
    background: #fee2e2;
    color: var(--bad);
  }

  .almost-btn {
    background: #fef3c7;
    color: var(--almost);
  }

  .know {
    background: #dcfce7;
    color: var(--good);
  }

  .nav-row {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  .nav-row button {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .accent-btn {
    background: var(--accent);
    color: white;
    border: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 0;
    border-radius: 10px;
    cursor: pointer;
  }

  .done {
    text-align: center;
  }

  .done h2 {
    margin-bottom: 8px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  /* Manage deck view */
  .manage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .add-form input,
  .add-form textarea {
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    resize: vertical;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .deck-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .deck-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .deck-item-word {
    font-weight: 700;
    font-size: 15px;
  }

  .deck-item-def {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    color: var(--bad);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
    border: none;
    cursor: pointer;
  }

  .deck-count {
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
  const STORAGE_KEY = "vocabPracticeDeck";

  const defaultDeck = [
    { word: "Ephemeral", definition: "Lasting for a very short time." },
    { word: "Ubiquitous", definition: "Present, appearing, or found everywhere." },
    { word: "Candid", definition: "Truthful and straightforward; frank." },
    { word: "Meticulous", definition: "Showing great attention to detail; very careful." },
    { word: "Resilient", definition: "Able to recover quickly from difficulties." },
    { word: "Ambiguous", definition: "Open to more than one interpretation; unclear." },
    { word: "Pragmatic", definition: "Dealing with things sensibly and realistically." },
    { word: "Eloquent", definition: "Fluent and persuasive in speaking or writing." },
    { word: "Tenacious", definition: "Persistent; not easily giving up." },
    { word: "Superfluous", definition: "Unnecessary; more than what is required." }
  ];

  function loadDeck() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    saveDeck(defaultDeck);
    return defaultDeck.slice();
  }

  function saveDeck(deck) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(deck));
  }

  let deck = loadDeck();
  let view = "practice"; // "practice" | "manage"

  // practice session state
  let firstSide = "term"; // "term" | "definition"
  let order = [];
  let pos = 0;
  let side = "term"; // currently visible side for current card
  let score = { gotit: 0, almost: 0, dontknow: 0 };

  const app = document.getElementById("app");

  function resetPracticeSession() {
    order = deck.map((_, i) => i);
    pos = 0;
    side = firstSide;
    score = { gotit: 0, almost: 0, dontknow: 0 };
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    side = firstSide;
  }

  resetPracticeSession();

  function render() {
    app.innerHTML = `
      <div class="tabs">
        <div class="tab ${view === 'practice' ? 'active' : ''}" id="tabPractice">Practice</div>
        <div class="tab ${view === 'manage' ? 'active' : ''}" id="tabManage">Manage Deck</div>
      </div>
      <div id="viewRoot" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;"></div>
    `;

    document.getElementById("tabPractice").addEventListener("click", () => {
      view = "practice";
      resetPracticeSession();
      render();
    });
    document.getElementById("tabManage").addEventListener("click", () => {
      view = "manage";
      render();
    });

    const root = document.getElementById("viewRoot");
    if (view === "practice") {
      renderPractice(root);
    } else {
      renderManage(root);
    }
  }

  function renderPractice(root) {
    if (deck.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p>No cards yet.</p>
          <p>Add some in "Manage Deck" to start practicing.</p>
        </div>
      `;
      return;
    }

    root.innerHTML = "";

    const topbar = document.createElement("div");
    topbar.className = "practice-topbar";
    topbar.innerHTML = `
      <div class="side-toggle">
        <div class="side-toggle-btn ${firstSide === 'term' ? 'active' : ''}" id="termFirstBtn">Term first</div>
        <div class="side-toggle-btn ${firstSide === 'definition' ? 'active' : ''}" id="defFirstBtn">Definition first</div>
      </div>
    `;
    root.appendChild(topbar);
    topbar.querySelector("#termFirstBtn").addEventListener("click", () => {
      firstSide = "term";
      side = "term";
      render();
    });
    topbar.querySelector("#defFirstBtn").addEventListener("click", () => {
      firstSide = "definition";
      side = "definition";
      render();
    });

    if (pos >= order.length) {
      const totalRated = score.gotit + score.almost + score.dontknow;
      const skipped = deck.length - totalRated;
      const done = document.createElement("div");
      done.className = "done";
      done.innerHTML = `
        <h2>Done!</h2>
        <p>Got it: ${score.gotit} &nbsp;|&nbsp; Almost: ${score.almost} &nbsp;|&nbsp; Didn't know: ${score.dontknow}</p>
        ${skipped > 0 ? `<p>Skipped: ${skipped}</p>` : ""}
        <button class="accent-btn" id="restart">Practice again</button>
      `;
      root.appendChild(done);
      done.querySelector("#restart").addEventListener("click", () => {
        resetPracticeSession();
        render();
      });
      return;
    }

    const current = deck[order[pos]];
    const progressPct = Math.round((pos / order.length) * 100);

    const progressLabel = document.createElement("div");
    progressLabel.className = "progress-label";
    progressLabel.textContent = `${pos + 1} / ${order.length}`;
    root.appendChild(progressLabel);

    const progressTrack = document.createElement("div");
    progressTrack.className = "progress-track";
    progressTrack.innerHTML = `<div class="progress-fill" style="width:${progressPct}%"></div>`;
    root.appendChild(progressTrack);

    const scene = document.createElement("div");
    scene.className = "card-scene";
    scene.innerHTML = `
      <div class="card-inner ${side !== firstSide ? 'flip' : ''}" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="side-label">TERM</div>
            <div class="word">${escapeHtml(current.word)}</div>
            <div class="hint">Tap to flip</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="side-label">DEFINITION</div>
            <div class="definition">${escapeHtml(current.definition)}</div>
            <div class="hint">Tap to flip back</div>
          </div>
        </div>
      </div>
    `;
    root.appendChild(scene);
    scene.addEventListener("click", () => {
      side = side === "term" ? "definition" : "term";
      render();
    });

    if (side === "definition") {
      const rateRow = document.createElement("div");
      rateRow.className = "rate-row";
      rateRow.innerHTML = `
        <button class="dont-know" id="dontKnow">Didn't know</button>
        <button class="almost-btn" id="almost">Almost</button>
        <button class="know" id="gotit">Got it</button>
      `;
      root.appendChild(rateRow);
      rateRow.querySelector("#dontKnow").addEventListener("click", (e) => {
        e.stopPropagation();
        score.dontknow++;
        pos++;
        side = firstSide;
        render();
      });
      rateRow.querySelector("#almost").addEventListener("click", (e) => {
        e.stopPropagation();
        score.almost++;
        pos++;
        side = firstSide;
        render();
      });
      rateRow.querySelector("#gotit").addEventListener("click", (e) => {
        e.stopPropagation();
        score.gotit++;
        pos++;
        side = firstSide;
        render();
      });
    }

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <button id="prevBtn">Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next</button>
    `;
    root.appendChild(navRow);
    navRow.querySelector("#prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      pos = Math.max(0, pos - 1);
      side = firstSide;
      render();
    });
    navRow.querySelector("#shuffleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      shuffleOrder();
      render();
    });
    navRow.querySelector("#nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderManage(root) {
    root.innerHTML = `
      <div class="manage">
        <div class="add-form">
          <input type="text" id="newWord" placeholder="Word" />
          <textarea id="newDef" placeholder="Definition" rows="2"></textarea>
          <button class="accent-btn" id="addBtn">Add card</button>
        </div>

        <div class="deck-count">${deck.length} card${deck.length === 1 ? '' : 's'} in deck</div>

        <div class="deck-list" id="deckList"></div>
      </div>
    `;

    const list = root.querySelector("#deckList");
    if (deck.length === 0) {
      list.innerHTML = `<div class="empty-state">Your deck is empty. Add a word above.</div>`;
    } else {
      deck.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "deck-item";
        row.innerHTML = `
          <div class="deck-item-text">
            <div class="deck-item-word">${escapeHtml(item.word)}</div>
            <div class="deck-item-def">${escapeHtml(item.definition)}</div>
          </div>
          <button class="delete-btn" data-index="${i}">&times;</button>
        `;
        list.appendChild(row);
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-index"), 10);
          deck.splice(i, 1);
          saveDeck(deck);
          render();
        });
      });
    }

    root.querySelector("#addBtn").addEventListener("click", () => {
      const wordInput = root.querySelector("#newWord");
      const defInput = root.querySelector("#newDef");
      const word = wordInput.value.trim();
      const definition = defInput.value.trim();
      if (!word || !definition) return;
      deck.push({ word, definition });
      saveDeck(deck);
      render();
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>

</body>
</html>
