<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Practice</title>
<style>
  :root {
    --bg: #f0ebdd;
    --text: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #fdfcf9;
    --border: #e5e1d3;
    --accent: #2563eb;
    --teal: #0d9488;
    --good: #16a34a;
    --almost: #b45309;
    --bad: #dc2626;
  }

  * { box-sizing: border-box; }

  button,
  .tab,
  .side-toggle-btn,
  .card-scene {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  .tab,
  .side-toggle-btn {
    transition: transform 0.16s ease, box-shadow 0.16s ease,
      background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    transform: translateY(0) scale(1);
  }

  button:hover,
  .tab:hover,
  .side-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(37, 99, 235, 0.14);
  }

  button:active,
  .tab:active,
  .side-toggle-btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.12);
    transition-duration: 0.07s;
  }

  button:focus-visible,
  .tab:focus-visible,
  .side-toggle-btn:focus-visible,
  .card-scene:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.35);
    outline-offset: 3px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 1080px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin: auto;
  }

  .app-shell {
    width: 100%;
    display: grid;
    grid-template-columns: 220px minmax(0, 760px);
    justify-content: center;
    align-items: start;
    gap: 24px;
  }

  .sidebar {
    position: sticky;
    top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 4px 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: white;
    font-size: 20px;
    box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
  }

  .brand-copy strong,
  .brand-copy span {
    display: block;
  }

  .brand-copy strong { font-size: 14px; }
  .brand-copy span { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .nav-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }

  .nav-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 6px 14px rgba(37, 99, 235, 0.22);
  }

  .nav-icon {
    width: 22px;
    text-align: center;
    font-size: 17px;
  }

  .view-root {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .tabs {
    width: 100%;
    display: flex;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 14px 0;
    border: 0;
    background: transparent;
    border-radius: 9px;
    font-weight: 600;
    font-size: 17px;
    cursor: pointer;
    color: var(--muted);
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  .practice-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .side-toggle {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .side-toggle-btn {
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }

  .side-toggle-btn.active {
    background: var(--teal);
    color: white;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 16px;
    color: var(--muted);
    align-self: center;
  }

  .card-scene {
    width: 100%;
    min-height: 420px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .card-scene:hover {
    transform: translateY(-3px);
  }

  .card-scene:active {
    transform: translateY(0) scale(0.99);
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 420px;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card-inner.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    backface-visibility: hidden;
    user-select: none;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.07);
    border-top: 6px solid transparent;
  }

  .card-front {
    background: var(--card-bg);
    border-top-color: var(--accent);
  }

  .card-back {
    background: #e6f7f3;
    border-top-color: var(--teal);
    transform: rotateY(180deg);
  }

  .side-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .word {
    font-size: 46px;
    font-weight: 700;
  }

  .definition {
    font-size: 38px;
    font-weight: 700;
    line-height: 1.4;
  }

  .hint {
    font-size: 15px;
    color: var(--muted);
    margin-top: 20px;
  }

  .rate-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .rate-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  .dont-know {
    background: #fee2e2;
    color: var(--bad);
  }

  .almost-btn {
    background: #fef3c7;
    color: var(--almost);
  }

  .know {
    background: #dcfce7;
    color: var(--good);
  }

  .nav-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .nav-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .accent-btn {
    background: var(--accent);
    color: white;
    border: none;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    cursor: pointer;
  }

  .done {
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .done h2 {
    font-size: 26px;
    margin-bottom: 4px;
  }

  .done p {
    font-size: 17px;
  }

  .restart-btn {
    color: white;
    border: none;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 28px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
    margin: 10px 0 18px;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.24);
    letter-spacing: 0.01em;
  }

  .restart-btn:hover {
    box-shadow: 0 12px 26px rgba(37, 99, 235, 0.3);
  }

  .missed-btn {
    background: #fef3c7;
    color: var(--almost);
    border: none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
  }

  .results-review {
    display: flex;
    flex-direction: column;
    gap: 9px;
    text-align: left;
  }

  .results-review h3 {
    margin: 4px 0;
    text-align: center;
  }

  .result-group {
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card-bg);
    overflow: hidden;
  }

  .result-group summary {
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 750;
    list-style-position: inside;
    transition: background-color 0.16s ease;
  }

  .result-group summary:hover {
    background: rgba(37, 99, 235, 0.06);
  }

  .result-group.dont-know-group summary { color: var(--bad); }
  .result-group.almost-group summary { color: var(--almost); }
  .result-group.got-it-group summary { color: var(--good); }

  .result-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px 12px;
  }

  .result-item {
    border-top: 1px solid var(--border);
    padding: 10px 2px 2px;
  }

  .result-word {
    font-weight: 750;
    margin-bottom: 3px;
  }

  .result-definition {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .result-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 2px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  /* Manage deck view */
  .manage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .add-form input,
  .add-form textarea {
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    resize: vertical;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .deck-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .deck-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .deck-item-word {
    font-weight: 700;
    font-size: 15px;
  }

  .deck-item-def {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    color: var(--bad);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
    border: none;
    cursor: pointer;
  }

  .deck-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .edit-btn {
    background: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .form-actions button {
    flex: 1;
  }

  .cancel-btn {
    background: var(--card-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .deck-count {
    font-size: 13px;
    color: var(--muted);
  }

  /* Dictionary view */
  .dictionary-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .dictionary-header h2 {
    margin: 0 0 4px;
  }

  .dictionary-header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .dictionary-search {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    outline: none;
  }

  .dictionary-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 3px;
  }

  .dictionary-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-item:hover {
    transform: translateX(3px);
    border-color: rgba(37, 99, 235, 0.38);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }

  .dictionary-word {
    font-weight: 750;
    margin-bottom: 4px;
  }

  .dictionary-definition {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  .session-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .small-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Bubble Shot game */
  .bubble-game {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .game-heading h2 { margin: 0 0 4px; }
  .game-heading p { margin: 0; color: var(--muted); font-size: 13px; }

  .game-stats {
    display: flex;
    gap: 8px;
  }

  .stat-pill {
    min-width: 62px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    text-align: center;
  }

  .stat-pill strong,
  .stat-pill span { display: block; }
  .stat-pill strong { color: var(--accent); font-size: 18px; }
  .stat-pill span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }

  .definition-prompt {
    padding: 22px 20px;
    border-radius: 15px;
    background: linear-gradient(135deg, #eef4ff, #e7faf6);
    border: 1px solid rgba(37, 99, 235, 0.16);
    text-align: center;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
  }

  .definition-prompt .side-label { margin-bottom: 9px; }
  .definition-prompt p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.42; }

  .bubble-field {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    padding: 8px 4px;
  }

  .word-bubble {
    position: relative;
    width: 100%;
    aspect-ratio: 1.2;
    min-height: 120px;
    display: grid;
    place-items: center;
    padding: 20px 12px;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 50%;
    color: #15325b;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.15;
    text-align: center;
    cursor: crosshair;
    box-shadow: inset -8px -10px 18px rgba(37, 99, 235, 0.12),
      inset 7px 8px 14px rgba(255, 255, 255, 0.7),
      0 10px 22px rgba(37, 99, 235, 0.14);
    animation: bubbleFloat 3.2s ease-in-out infinite;
  }

  .word-bubble::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 13%;
    top: 17%;
    left: 22%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.64);
    transform: rotate(-22deg);
    pointer-events: none;
  }

  .word-bubble:nth-child(1) { background: linear-gradient(145deg, #c7e2ff, #9ed0ff); }
  .word-bubble:nth-child(2) { background: linear-gradient(145deg, #c9f4e8, #93e2cf); animation-delay: -0.8s; }
  .word-bubble:nth-child(3) { background: linear-gradient(145deg, #fce2b7, #f7c978); animation-delay: -1.6s; }
  .word-bubble:nth-child(4) { background: linear-gradient(145deg, #e5d5ff, #c5a6f6); animation-delay: -2.4s; }

  .word-bubble:hover {
    transform: translateY(-5px) scale(1.035);
    box-shadow: inset -8px -10px 18px rgba(37, 99, 235, 0.12),
      inset 7px 8px 14px rgba(255, 255, 255, 0.7),
      0 16px 28px rgba(37, 99, 235, 0.2);
  }

  .word-bubble.correct {
    background: #bbf7d0;
    border-color: var(--good);
    color: #14532d;
    animation: none;
  }

  .word-bubble.wrong {
    background: #fecaca;
    border-color: var(--bad);
    color: #7f1d1d;
    animation: none;
  }

  .word-bubble:disabled { cursor: default; opacity: 0.72; }
  .word-bubble.correct:disabled,
  .word-bubble.wrong:disabled { opacity: 1; }

  .game-feedback {
    min-height: 24px;
    text-align: center;
    font-weight: 800;
  }

  .game-feedback.correct { color: var(--good); }
  .game-feedback.wrong { color: var(--bad); }

  .game-footer {
    display: flex;
    justify-content: center;
  }

  @keyframes bubbleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @media (max-width: 720px) {
    body { padding: 14px; }

    .app-shell {
      grid-template-columns: minmax(0, 760px);
      gap: 14px;
    }

    .sidebar {
      position: static;
      padding: 12px;
      gap: 10px;
    }

    .sidebar-brand { padding-bottom: 9px; }
    .sidebar-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .nav-btn { flex-direction: column; gap: 3px; padding: 8px 3px; text-align: center; font-size: 11px; }
    .nav-icon { font-size: 16px; }
  }

  @media (max-width: 390px) {
    .bubble-field { gap: 10px; }
    .word-bubble { min-height: 108px; font-size: 14px; }
    .game-heading { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
  const STORAGE_KEY = "vocabPracticeCustomWords";
  const LEGACY_STORAGE_KEY = "vocabPracticeDeck";
  const SESSION_SIZE = 10;

  const dictionary = [
    { word: "Ephemeral", definition: "Lasting for a very short time." },
    { word: "Ubiquitous", definition: "Present, appearing, or found everywhere." },
    { word: "Candid", definition: "Truthful and straightforward; frank." },
    { word: "Meticulous", definition: "Showing great attention to detail; very careful." },
    { word: "Resilient", definition: "Able to recover quickly from difficulties." },
    { word: "Ambiguous", definition: "Open to more than one interpretation; unclear." },
    { word: "Pragmatic", definition: "Dealing with things sensibly and realistically." },
    { word: "Eloquent", definition: "Fluent and persuasive in speaking or writing." },
    { word: "Tenacious", definition: "Persistent; not easily giving up." },
    { word: "Superfluous", definition: "Unnecessary; more than what is required." },
    { word: "Benevolent", definition: "Well-meaning and kindly." },
    { word: "Conundrum", definition: "A confusing and difficult problem or question." },
    { word: "Diligent", definition: "Showing careful and persistent effort." },
    { word: "Empathy", definition: "The ability to understand and share another person's feelings." },
    { word: "Fortuitous", definition: "Happening by chance, often with a fortunate result." },
    { word: "Gregarious", definition: "Fond of company; sociable." },
    { word: "Impeccable", definition: "In accordance with the highest standards; faultless." },
    { word: "Juxtapose", definition: "To place things close together for comparison or contrast." },
    { word: "Lucid", definition: "Expressed clearly; easy to understand." },
    { word: "Magnanimous", definition: "Generous or forgiving, especially toward a rival." },
    { word: "Nuance", definition: "A subtle distinction or variation." },
    { word: "Obsolete", definition: "No longer produced or used; out of date." },

  function loadCustomWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);

      const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacyRaw) {
        const builtInWords = new Set(dictionary.map((item) => item.word.toLowerCase()));
        const migrated = JSON.parse(legacyRaw).filter(
          (item) => item && item.word && item.definition && !builtInWords.has(item.word.toLowerCase())
        );
        saveCustomWords(migrated);
        return migrated;
      }
    } catch (e) {}
    return [];
  }

  function saveCustomWords(words) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  function getAllWords() {
    const unique = new Map();
    [...dictionary, ...customWords].forEach((item) => {
      unique.set(item.word.toLowerCase(), item);
    });
    return Array.from(unique.values()).sort((a, b) => a.word.localeCompare(b.word));
  }

  function randomSample(items, count) {
    const shuffled = items.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(count, shuffled.length));
  }

  // --- sound effects (synthesized, no audio files needed) ---
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, type, startGain) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(startGain, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function playFlipSound() {
    playTone(500, 0.08, "sine", 0.1);
    setTimeout(() => playTone(720, 0.08, "sine", 0.08), 40);
  }
  function playGotItSound() {
    playTone(523.25, 0.1, "sine", 0.15);
    setTimeout(() => playTone(783.99, 0.16, "sine", 0.15), 90);
  }
  function playAlmostSound() {
    playTone(440, 0.16, "sine", 0.12);
  }
  function playDontKnowSound() {
    playTone(300, 0.1, "sawtooth", 0.07);
    setTimeout(() => playTone(220, 0.18, "sawtooth", 0.07), 70);
  }
  function playClickSound() {
    playTone(600, 0.05, "square", 0.05);
  }

  let customWords = loadCustomWords();
  let deck = randomSample(getAllWords(), SESSION_SIZE);
  let view = "practice"; // "practice" | "bubble" | "dictionary" | "manage"
  let editingIndex = null;

  // practice session state
  let firstSide = "term"; // "term" | "definition"
  let order = [];
  let pos = 0;
  let side = "term"; // currently visible side for current card
  let practiceMode = "random"; // "random" | "missed"
  let score = { gotit: 0, almost: 0, dontknow: 0 };
  let results = {}; // original deck index -> "gotit" | "almost" | "dontknow" | "skipped"

  let bubbleGame = {
    score: 0,
    attempts: 0,
    streak: 0,
    answer: null,
    choices: [],
    selectedWord: null,
    feedback: "",
    feedbackType: "",
    locked: false
  };

  const app = document.getElementById("app");

  function resetPracticeSession(indices) {
    order = indices ? indices.slice() : deck.map((_, i) => i);
    practiceMode = Array.isArray(indices) ? "missed" : "random";
    pos = 0;
    side = firstSide;
    score = { gotit: 0, almost: 0, dontknow: 0 };
    results = {};
  }

  function getResultItems(category) {
    return Object.entries(results)
      .filter(([, result]) => result === category)
      .map(([index]) => deck[Number(index)])
      .filter(Boolean);
  }

  function resultGroupHtml(title, items, className) {
    const itemMarkup = items.length
      ? items.map((item) => `
          <div class="result-item">
            <div class="result-word">${escapeHtml(item.word)}</div>
            <div class="result-definition">${escapeHtml(item.definition)}</div>
          </div>
        `).join("")
      : `<div class="result-empty">No words in this group.</div>`;

    return `
      <details class="result-group ${className}" ${items.length ? 'open' : ''}>
        <summary>${title} (${items.length})</summary>
        <div class="result-items">${itemMarkup}</div>
      </details>
    `;
  }

  function generateNewSession() {
    deck = randomSample(getAllWords(), SESSION_SIZE);
    resetPracticeSession();
  }

  function createBubbleRound() {
    const words = getAllWords();
    if (words.length < 4) {
      bubbleGame.answer = null;
      bubbleGame.choices = [];
      return;
    }

    const answer = words[Math.floor(Math.random() * words.length)];
    const decoys = randomSample(
      words.filter((item) => item.word.toLowerCase() !== answer.word.toLowerCase()),
      3
    );

    bubbleGame.answer = answer;
    bubbleGame.choices = randomSample([answer, ...decoys], 4);
    bubbleGame.selectedWord = null;
    bubbleGame.feedback = "";
    bubbleGame.feedbackType = "";
    bubbleGame.locked = false;
  }

  function resetBubbleGame() {
    bubbleGame.score = 0;
    bubbleGame.attempts = 0;
    bubbleGame.streak = 0;
    createBubbleRound();
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    side = firstSide;
  }

  resetPracticeSession();

  function render() {
    app.innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-brand">
            <div class="brand-mark" aria-hidden="true">V</div>
            <div class="brand-copy">
              <strong>Vocab Lab</strong>
              <span>Learn through play</span>
            </div>
          </div>
          <nav class="sidebar-nav" aria-label="Vocabulary activities">
            <button class="nav-btn ${view === 'practice' ? 'active' : ''}" data-view="practice" aria-current="${view === 'practice' ? 'page' : 'false'}">
              <span class="nav-icon" aria-hidden="true">▣</span><span>Flashcards</span>
            </button>
            <button class="nav-btn ${view === 'bubble' ? 'active' : ''}" data-view="bubble" aria-current="${view === 'bubble' ? 'page' : 'false'}">
              <span class="nav-icon" aria-hidden="true">◉</span><span>Bubble Shot</span>
            </button>
            <button class="nav-btn ${view === 'dictionary' ? 'active' : ''}" data-view="dictionary" aria-current="${view === 'dictionary' ? 'page' : 'false'}">
              <span class="nav-icon" aria-hidden="true">A</span><span>Dictionary</span>
            </button>
            <button class="nav-btn ${view === 'manage' ? 'active' : ''}" data-view="manage" aria-current="${view === 'manage' ? 'page' : 'false'}">
              <span class="nav-icon" aria-hidden="true">＋</span><span>My Words</span>
            </button>
          </nav>
        </aside>
        <main id="viewRoot" class="view-root"></main>
      </div>
    `;

    document.querySelectorAll(".nav-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const nextView = button.getAttribute("data-view");
        playClickSound();
        view = nextView;
        if (view === "practice") resetPracticeSession();
        if (view === "bubble" && !bubbleGame.answer) resetBubbleGame();
        render();
      });
    });

    const root = document.getElementById("viewRoot");
    if (view === "practice") {
      renderPractice(root);
    } else if (view === "bubble") {
      renderBubbleGame(root);
    } else if (view === "dictionary") {
      renderDictionary(root);
    } else {
      renderManage(root);
    }
  }

  function renderPractice(root) {
    if (deck.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p>No cards yet.</p>
          <p>Add some in "My Words" to start practicing.</p>
        </div>
      `;
      return;
    }

    root.innerHTML = "";

    const topbar = document.createElement("div");
    topbar.className = "practice-topbar";
    topbar.innerHTML = `
      <div class="side-toggle">
        <div class="side-toggle-btn ${firstSide === 'term' ? 'active' : ''}" id="termFirstBtn">Term first</div>
        <div class="side-toggle-btn ${firstSide === 'definition' ? 'active' : ''}" id="defFirstBtn">Definition first</div>
      </div>
    `;
    root.appendChild(topbar);
    topbar.querySelector("#termFirstBtn").addEventListener("click", () => {
      playClickSound();
      firstSide = "term";
      side = "term";
      render();
    });
    topbar.querySelector("#defFirstBtn").addEventListener("click", () => {
      playClickSound();
      firstSide = "definition";
      side = "definition";
      render();
    });

    if (pos >= order.length) {
      const skipped = Object.values(results).filter((result) => result === "skipped").length;
      const missedIndices = Object.keys(results)
        .filter((k) => results[k] !== "gotit")
        .map(Number);

      const done = document.createElement("div");
      done.className = "done";
      done.innerHTML = `
        <h2>Session complete!</h2>
        <p>Got it: ${score.gotit} &nbsp;|&nbsp; Almost: ${score.almost} &nbsp;|&nbsp; Didn't know: ${score.dontknow}</p>
        ${skipped > 0 ? `<p>Skipped: ${skipped}</p>` : ""}
        <button class="accent-btn restart-btn" id="restart">&#8635; Practice again</button>
        ${missedIndices.length > 0 ? `<button class="missed-btn" id="practiceMissed">Practice missed &amp; skipped (${missedIndices.length})</button>` : ""}
        <div class="results-review">
          <h3>Review your words</h3>
          ${resultGroupHtml("Didn't know", getResultItems("dontknow"), "dont-know-group")}
          ${resultGroupHtml("Almost got it", getResultItems("almost"), "almost-group")}
          ${resultGroupHtml("Got it", getResultItems("gotit"), "got-it-group")}
        </div>
      `;
      root.appendChild(done);
      done.querySelector("#restart").addEventListener("click", () => {
        playClickSound();
        resetPracticeSession();
        render();
      });
      const missedBtn = done.querySelector("#practiceMissed");
      if (missedBtn) {
        missedBtn.addEventListener("click", () => {
          playClickSound();
          resetPracticeSession(missedIndices);
          render();
        });
      }
      return;
    }

    const current = deck[order[pos]];
    const progressPct = Math.round((pos / order.length) * 100);
    const frontIsTerm = firstSide === "term";
    const frontLabel = frontIsTerm ? "TERM" : "DEFINITION";
    const frontValue = frontIsTerm ? current.word : current.definition;
    const backLabel = frontIsTerm ? "DEFINITION" : "TERM";
    const backValue = frontIsTerm ? current.definition : current.word;

    const sessionActions = document.createElement("div");
    sessionActions.className = "session-actions";
    sessionActions.innerHTML = `
      <div class="progress-label">${pos + 1} / ${order.length} ${practiceMode === "missed" ? "missed &amp; skipped words" : "random words"}</div>
      <button class="small-btn" id="newSessionBtn">New 10</button>
    `;
    root.appendChild(sessionActions);
    sessionActions.querySelector("#newSessionBtn").addEventListener("click", () => {
      playClickSound();
      generateNewSession();
      render();
    });

    const progressTrack = document.createElement("div");
    progressTrack.className = "progress-track";
    progressTrack.innerHTML = `<div class="progress-fill" style="width:${progressPct}%"></div>`;
    root.appendChild(progressTrack);

    const scene = document.createElement("div");
    scene.className = "card-scene";
    scene.tabIndex = 0;
    scene.setAttribute("role", "button");
    scene.setAttribute("aria-label", "Flip vocabulary card");
    scene.innerHTML = `
      <div class="card-inner ${side !== firstSide ? 'flip' : ''}" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="side-label">${frontLabel}</div>
            <div class="${frontIsTerm ? 'word' : 'definition'}">${escapeHtml(frontValue)}</div>
            <div class="hint">Tap to flip</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="side-label">${backLabel}</div>
            <div class="${frontIsTerm ? 'definition' : 'word'}">${escapeHtml(backValue)}</div>
            <div class="hint">Tap to flip back</div>
          </div>
        </div>
      </div>
    `;
    root.appendChild(scene);

    function flipCard() {
      playFlipSound();
      side = side === "term" ? "definition" : "term";
      const inner = document.getElementById("cardInner");
      if (inner) inner.classList.toggle("flip");
      renderRateRow();
    }

    scene.addEventListener("click", flipCard);
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });

    const rateRowContainer = document.createElement("div");
    rateRowContainer.id = "rateRowContainer";
    rateRowContainer.style.width = "100%";
    root.appendChild(rateRowContainer);
    renderRateRow();

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <button id="prevBtn">Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next</button>
    `;
    root.appendChild(navRow);
    navRow.querySelector("#prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      pos = Math.max(0, pos - 1);
      side = firstSide;
      render();
    });
    navRow.querySelector("#shuffleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      shuffleOrder();
      render();
    });
    navRow.querySelector("#nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      if (!(order[pos] in results)) results[order[pos]] = "skipped";
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderRateRow() {
    const container = document.getElementById("rateRowContainer");
    if (!container) return;
    if (side === firstSide) {
      container.innerHTML = "";
      return;
    }
    container.innerHTML = `
      <div class="rate-row">
        <button class="dont-know" id="dontKnow">Didn't know</button>
        <button class="almost-btn" id="almost">Almost got it</button>
        <button class="know" id="gotit">Got it</button>
      </div>
    `;
    container.querySelector("#dontKnow").addEventListener("click", (e) => {
      e.stopPropagation();
      playDontKnowSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "dontknow";
      score.dontknow++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#almost").addEventListener("click", (e) => {
      e.stopPropagation();
      playAlmostSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "almost";
      score.almost++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#gotit").addEventListener("click", (e) => {
      e.stopPropagation();
      playGotItSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "gotit";
      score.gotit++;
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderBubbleGame(root) {
    if (!bubbleGame.answer) createBubbleRound();

    if (!bubbleGame.answer) {
      root.innerHTML = `<div class="empty-state">Add at least four words to play Bubble Shot.</div>`;
      return;
    }

    root.innerHTML = `
      <section class="bubble-game" aria-labelledby="bubbleGameTitle">
        <div class="game-heading">
          <div>
            <h2 id="bubbleGameTitle">Bubble Shot</h2>
            <p>Shoot the word that matches the definition.</p>
          </div>
          <div class="game-stats" aria-label="Game score">
            <div class="stat-pill"><strong>${bubbleGame.score}</strong><span>Score</span></div>
            <div class="stat-pill"><strong>${bubbleGame.streak}</strong><span>Streak</span></div>
          </div>
        </div>

        <div class="definition-prompt">
          <div class="side-label">FIND THIS WORD</div>
          <p>${escapeHtml(bubbleGame.answer.definition)}</p>
        </div>

        <div class="bubble-field" aria-label="Word choices">
          ${bubbleGame.choices.map((choice, index) => {
            const isAnswer = choice.word === bubbleGame.answer.word;
            const isSelected = choice.word === bubbleGame.selectedWord;
            const stateClass = bubbleGame.locked && isAnswer
              ? "correct"
              : bubbleGame.locked && isSelected
                ? "wrong"
                : "";
            return `
              <button
                class="word-bubble ${stateClass}"
                data-choice-index="${index}"
                ${bubbleGame.locked ? "disabled" : ""}
                aria-label="Shoot ${escapeHtml(choice.word)}"
              >${escapeHtml(choice.word)}</button>
            `;
          }).join("")}
        </div>

        <div class="game-feedback ${bubbleGame.feedbackType}" aria-live="polite">
          ${escapeHtml(bubbleGame.feedback)}
        </div>

        <div class="game-footer">
          <button class="small-btn" id="newBubbleGame">New game</button>
        </div>
      </section>
    `;

    root.querySelectorAll(".word-bubble").forEach((button) => {
      button.addEventListener("click", () => {
        if (bubbleGame.locked) return;

        const choiceIndex = Number(button.getAttribute("data-choice-index"));
        const choice = bubbleGame.choices[choiceIndex];
        const isCorrect = choice.word === bubbleGame.answer.word;

        bubbleGame.locked = true;
        bubbleGame.attempts++;
        bubbleGame.selectedWord = choice.word;

        if (isCorrect) {
          bubbleGame.score++;
          bubbleGame.streak++;
          bubbleGame.feedback = `Bullseye! ${bubbleGame.answer.word} is correct.`;
          bubbleGame.feedbackType = "correct";
          playGotItSound();
        } else {
          bubbleGame.streak = 0;
          bubbleGame.feedback = `Not quite — the answer is ${bubbleGame.answer.word}.`;
          bubbleGame.feedbackType = "wrong";
          playDontKnowSound();
        }

        const answeredAttempt = bubbleGame.attempts;
        render();
        setTimeout(() => {
          if (view === "bubble" && bubbleGame.locked && bubbleGame.attempts === answeredAttempt) {
            createBubbleRound();
            render();
          }
        }, 950);
      });
    });

    root.querySelector("#newBubbleGame").addEventListener("click", () => {
      playClickSound();
      resetBubbleGame();
      render();
    });
  }

  function renderManage(root) {
    const editingWord = editingIndex === null ? null : customWords[editingIndex];
    root.innerHTML = `
      <div class="manage">
        <div class="dictionary-header">
          <h2>My Words</h2>
          <p>Add your own words to the built-in dictionary and future random sessions.</p>
        </div>
        <div class="add-form">
          <strong>${editingWord ? 'Edit word' : 'Add a word'}</strong>
          <input type="text" id="newWord" placeholder="Word" />
          <textarea id="newDef" placeholder="Definition" rows="2"></textarea>
          <div class="form-actions">
            ${editingWord ? '<button class="cancel-btn" id="cancelEditBtn">Cancel</button>' : ''}
            <button class="accent-btn" id="addBtn">${editingWord ? 'Save changes' : 'Add word'}</button>
          </div>
        </div>

        <div class="deck-count">${customWords.length} custom word${customWords.length === 1 ? '' : 's'}</div>

        <div class="deck-list" id="deckList"></div>
      </div>
    `;

    const list = root.querySelector("#deckList");
    if (customWords.length === 0) {
      list.innerHTML = `<div class="empty-state">No custom words yet. Add one above or explore the Dictionary tab.</div>`;
    } else {
      customWords.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "deck-item";
        row.innerHTML = `
          <div class="deck-item-text">
            <div class="deck-item-word">${escapeHtml(item.word)}</div>
            <div class="deck-item-def">${escapeHtml(item.definition)}</div>
          </div>
          <div class="deck-item-actions">
            <button class="edit-btn" data-index="${i}" aria-label="Edit ${escapeHtml(item.word)}">Edit</button>
            <button class="delete-btn" data-index="${i}" aria-label="Delete ${escapeHtml(item.word)}">&times;</button>
          </div>
        `;
        list.appendChild(row);
      });

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          editingIndex = parseInt(btn.getAttribute("data-index"), 10);
          render();
          document.getElementById("newWord").focus();
        });
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          const i = parseInt(btn.getAttribute("data-index"), 10);
          customWords.splice(i, 1);
          if (editingIndex === i) editingIndex = null;
          else if (editingIndex !== null && editingIndex > i) editingIndex--;
          saveCustomWords(customWords);
          generateNewSession();
          render();
        });
      });
    }

    const wordInput = root.querySelector("#newWord");
    const defInput = root.querySelector("#newDef");
    if (editingWord) {
      wordInput.value = editingWord.word;
      defInput.value = editingWord.definition;
      root.querySelector("#cancelEditBtn").addEventListener("click", () => {
        playClickSound();
        editingIndex = null;
        render();
      });
    }

    root.querySelector("#addBtn").addEventListener("click", () => {
      const word = wordInput.value.trim();
      const definition = defInput.value.trim();
      if (!word || !definition) return;
      const duplicate = getAllWords().some((item) => {
        const isCurrentEdit = editingIndex !== null && customWords[editingIndex] === item;
        return !isCurrentEdit && item.word.toLowerCase() === word.toLowerCase();
      });
      if (duplicate) {
        wordInput.setCustomValidity("That word is already in the dictionary.");
        wordInput.reportValidity();
        return;
      }
      playClickSound();
      if (editingIndex === null) {
        customWords.push({ word, definition });
      } else {
        customWords[editingIndex] = { word, definition };
        editingIndex = null;
      }
      saveCustomWords(customWords);
      generateNewSession();
      render();
    });
  }

  function renderDictionary(root) {
    const allWords = getAllWords();
    root.innerHTML = `
      <div class="dictionary-view">
        <div class="dictionary-header">
          <h2>Dictionary</h2>
          <p>${allWords.length} words available. Ten are selected randomly whenever the site loads.</p>
        </div>
        <input
          class="dictionary-search"
          id="dictionarySearch"
          type="search"
          placeholder="Search words or definitions"
          aria-label="Search dictionary"
        />
        <div class="dictionary-list" id="dictionaryList"></div>
      </div>
    `;

    const search = root.querySelector("#dictionarySearch");
    const list = root.querySelector("#dictionaryList");

    function drawDictionary(query = "") {
      const normalized = query.trim().toLowerCase();
      const matches = allWords.filter((item) =>
        !normalized || item.word.toLowerCase().includes(normalized) ||
        item.definition.toLowerCase().includes(normalized)
      );

      if (matches.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching words found.</div>`;
        return;
      }

      list.innerHTML = matches.map((item) => `
        <article class="dictionary-item">
          <div class="dictionary-word">${escapeHtml(item.word)}</div>
          <div class="dictionary-definition">${escapeHtml(item.definition)}</div>
        </article>
      `).join("");
    }

    search.addEventListener("input", () => drawDictionary(search.value));
    drawDictionary();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>

</body>
</html>
