<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabvault</title>
<style>
  :root {
    --bg: #f0ebdd;
    --text: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #fdfcf9;
    --border: #e5e1d3;
    --accent: #0d9488;
    --teal: #0d9488;
    --good: #16a34a;
    --almost: #b45309;
    --bad: #dc2626;
    --brand-dark: #04342c;
    --brand-muted: #4a6b62;
    --brand-icon: #085041;
    --teal-hero: #0f6e56;
    --chip-bg: #e1f5ee;
  }

  * { box-sizing: border-box; }

  button,
  .side-toggle-btn,
  .card-scene {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  .side-toggle-btn {
    transition: transform 0.16s ease, box-shadow 0.16s ease,
      background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    transform: translateY(0) scale(1);
  }

  button:hover,
  .side-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(13, 148, 136, 0.14);
  }

  button:active,
  .side-toggle-btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(13, 148, 136, 0.12);
    transition-duration: 0.07s;
  }

  button:focus-visible,
  .side-toggle-btn:focus-visible,
  .card-scene:focus-visible {
    outline: 3px solid rgba(13, 148, 136, 0.35);
    outline-offset: 3px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background:
      radial-gradient(circle at 12% 8%, rgba(13, 148, 136, 0.045), transparent 60%),
      radial-gradient(circle at 88% 92%, rgba(13, 148, 136, 0.04), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: auto;
  }

  .back-home-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--teal);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px 2px;
  }

  .home-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .home-header {
    height: 0;
  }

  .home-label {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 5;
    font-size: 22px;
    font-weight: 800;
    color: var(--brand-dark);
  }

  .home-welcome {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 5;
    font-size: 22px;
    font-weight: 800;
    color: var(--brand-muted);
  }

  .brand-bar {
    margin-top: -130px;
    padding: 36px 0 28px;
    text-align: center;
    opacity: 0;
    animation: cardRise 0.5s ease both;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 800;
    color: var(--brand-dark);
    letter-spacing: -0.01em;
  }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 33px;
    margin-top: 130px;
  }

  .home-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 0;
    background: linear-gradient(160deg, #fffdf8, var(--card-bg));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px 24px;
    min-height: 150px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    opacity: 0;
    animation: cardRise 0.5s ease both;
  }

  .home-grid .home-card:nth-child(1) { animation-delay: 0.05s; }
  .home-grid .home-card:nth-child(2) { animation-delay: 0.12s; }
  .home-grid .home-card:nth-child(3) { animation-delay: 0.19s; }

  @keyframes cardRise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .home-card.hero {
    background: linear-gradient(160deg, var(--teal-hero), #0c5c48);
    border-color: var(--teal-hero);
  }

  .home-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 26px rgba(13, 148, 136, 0.14);
  }

  .home-card-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--chip-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-icon);
    margin-bottom: 22px;
  }

  .home-card-icon svg {
    width: 26px;
    height: 26px;
  }

  .home-card-title {
    font-size: 21px;
    font-weight: 800;
    color: var(--brand-dark);
    margin: 0 0 6px;
  }

  .home-card-body {
    font-size: 14px;
    color: var(--brand-muted);
    line-height: 1.5;
    margin: 0;
  }

  .home-card.hero .home-card-title {
    color: var(--card-bg);
  }

  .home-card.hero .home-card-body {
    color: #9fe1cb;
  }

  .practice-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .side-toggle {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .side-toggle-btn {
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }

  .side-toggle-btn.active {
    background: var(--teal);
    color: white;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 14px;
    color: var(--muted);
    align-self: center;
  }

  .card-scene {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    min-height: 320px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .card-scene:hover {
    transform: translateY(-3px);
  }

  .card-scene:active {
    transform: translateY(0) scale(0.99);
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 320px;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card-inner.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 26px 22px;
    backface-visibility: hidden;
    user-select: none;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    border-top: 4px solid transparent;
  }

  .card-front {
    background: var(--card-bg);
    border-top-color: var(--accent);
  }

  .card-back {
    background: #e6f7f3;
    border-top-color: var(--teal);
    transform: rotateY(180deg);
  }

  .side-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .word {
    font-size: 36px;
    font-weight: 700;
  }

  .definition {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.35;
  }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }

  .rate-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .rate-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  .dont-know {
    background: #fee2e2;
    color: var(--bad);
  }

  .almost-btn {
    background: #fef3c7;
    color: var(--almost);
  }

  .know {
    background: #dcfce7;
    color: var(--good);
  }

  .nav-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .nav-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .accent-btn {
    background: var(--accent);
    color: white;
    border: none;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    cursor: pointer;
  }

  .done {
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .done h2 {
    font-size: 26px;
    margin-bottom: 4px;
  }

  .done p {
    font-size: 17px;
  }

  .restart-btn {
    color: white;
    border: none;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 28px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
    margin: 10px 0 18px;
    background: linear-gradient(135deg, var(--accent), #0f766e);
    box-shadow: 0 8px 20px rgba(13, 148, 136, 0.24);
    letter-spacing: 0.01em;
  }

  .restart-btn:hover {
    box-shadow: 0 12px 26px rgba(13, 148, 136, 0.3);
  }

  .missed-btn {
    background: #fef3c7;
    color: var(--almost);
    border: none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
  }

  .results-review {
    display: flex;
    flex-direction: column;
    gap: 9px;
    text-align: left;
  }

  .results-review h3 {
    margin: 4px 0;
    text-align: center;
  }

  .result-group {
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card-bg);
    overflow: hidden;
  }

  .result-group summary {
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 750;
    list-style-position: inside;
    transition: background-color 0.16s ease;
  }

  .result-group summary:hover {
    background: rgba(13, 148, 136, 0.06);
  }

  .result-group.dont-know-group summary { color: var(--bad); }
  .result-group.almost-group summary { color: var(--almost); }
  .result-group.got-it-group summary { color: var(--good); }

  .result-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px 12px;
  }

  .result-item {
    border-top: 1px solid var(--border);
    padding: 10px 2px 2px;
  }

  .result-word {
    font-weight: 750;
    margin-bottom: 3px;
  }

  .result-definition {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .result-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 2px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  /* Dictionary view */
  .manage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .dictionary-header h2 {
    margin: 0 0 4px;
  }

  .dictionary-header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .dictionary-toolbar {
    width: 100%;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .dictionary-search {
    flex: 1;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    outline: none;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .add-form input,
  .add-form textarea {
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    resize: vertical;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 3px;
  }

  .deck-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .deck-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .deck-item-word {
    font-weight: 700;
    font-size: 15px;
  }

  .deck-item-def {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    color: var(--bad);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
    border: none;
    cursor: pointer;
  }

  .deck-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .edit-btn {
    background: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .form-actions button {
    flex: 1;
  }

  .cancel-btn {
    background: var(--card-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .deck-count {
    font-size: 13px;
    color: var(--muted);
  }

  .session-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .small-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--teal);
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Games and Wordbound boss battle */
  .game-menu {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .game-menu-heading { grid-column: 1 / -1; }
  .game-menu-heading h2 { margin: 0 0 5px; }
  .game-menu-heading p { margin: 0; color: var(--muted); }

  .game-choice {
    min-height: 220px;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card-bg);
    text-align: left;
    cursor: pointer;
  }

  .game-choice-icon { display: block; font-size: 42px; margin-bottom: 22px; }
  .game-choice strong { display: block; font-size: 23px; margin-bottom: 8px; }
  .game-choice span:last-child { color: var(--muted); line-height: 1.5; }

  .app.battle-mode { max-width: 1100px; }

  .boss-battle {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .battle-topbar,
  .battle-actions,
  .combatant-row,
  .battle-resource-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .battle-topbar h2 { margin: 0 0 4px; }
  .battle-topbar p { margin: 0; color: var(--muted); }

  .battle-arena {
    min-height: 245px;
    padding: 22px;
    border-radius: 20px;
    border: 1px solid rgba(13, 148, 136, 0.2);
    background:
      linear-gradient(180deg, rgba(8, 35, 52, 0.18), rgba(20, 15, 45, 0.3)),
      url("assets/wordbound-arena.png") center / cover no-repeat;
    color: white;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.58);
  }

  .combatant { width: min(42%, 320px); text-align: center; }
  .combatant-name { font-weight: 800; font-size: 18px; margin-bottom: 8px; }
  .combatant-figure { font-size: 72px; line-height: 1; margin: 8px 0 14px; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.12)); }
  .combatant.player .combatant-figure { font-size: 58px; }
  .versus { color: var(--brand-muted); font-size: 13px; font-weight: 800; letter-spacing: 0.14em; }

  .health-track {
    width: 100%;
    height: 15px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(0,0,0,0.08);
  }

  .health-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width 0.35s ease; }
  .combatant.player .health-fill { background: linear-gradient(90deg, #0d9488, #22c55e); }
  .health-label { margin-top: 5px; font-size: 13px; font-weight: 750; }
  .shield-label { color: #2563eb; min-height: 18px; font-size: 13px; font-weight: 700; }

  .boss-intent {
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.68);
    font-size: 13px;
    font-weight: 700;
  }

  .battle-resource-row {
    padding: 11px 14px;
    border-radius: 13px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }

  .energy-display { color: #b45309; font-size: 17px; font-weight: 850; }
  .battle-status { color: var(--muted); font-size: 13px; text-align: right; }

  .battle-hand {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }

  .battle-card {
    position: relative;
    min-height: 235px;
    padding: 12px;
    border: 2px solid var(--card-edge, #0d9488);
    border-radius: 15px;
    background: var(--card-bg);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .battle-card.attack { --card-edge: #dc2626; }
  .battle-card.defense { --card-edge: #2563eb; }
  .battle-card.heal { --card-edge: #16a34a; }
  .battle-card.strategy { --card-edge: #7c3aed; }
  .battle-card.unaffordable { opacity: 0.48; cursor: not-allowed; }
  .battle-card-cost { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #fbbf24; font-weight: 900; }
  .battle-card-word { padding-right: 28px; font-size: 17px; font-weight: 900; overflow-wrap: anywhere; }
  .battle-card-name { margin-top: 5px; color: var(--card-edge); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.07em; }
  .battle-card-art { flex: 1; display: grid; place-items: center; font-size: 42px; }
  .battle-card-effect { min-height: 58px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; line-height: 1.4; }

  .end-turn-btn { border: 0; border-radius: 11px; padding: 12px 20px; background: var(--brand-dark); color: white; font-weight: 800; cursor: pointer; }
  .battle-message { min-height: 23px; font-weight: 750; color: var(--brand-dark); }

  .question-panel {
    padding: 20px;
    border: 2px solid var(--accent);
    border-radius: 16px;
    background: var(--card-bg);
    box-shadow: 0 16px 36px rgba(15, 110, 86, 0.14);
  }

  .question-panel h3 { margin: 0 0 5px; }
  .question-panel p { margin: 0 0 14px; color: var(--muted); }
  .question-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .question-option { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: white; text-align: left; cursor: pointer; font: inherit; }

  .battle-ending { padding: 36px; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--border); text-align: center; }
  .battle-ending h3 { margin: 0 0 9px; font-size: 30px; }

  @media (max-width: 850px) {
    .battle-hand { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .battle-card { min-height: 210px; }
  }

  @media (max-width: 600px) {
    .game-menu, .question-options { grid-template-columns: 1fr; }
    .combatant-row { align-items: flex-end; }
    .combatant { width: 46%; }
    .combatant-figure { font-size: 52px; }
    .battle-hand { grid-template-columns: 1fr; }
    .battle-card { min-height: 170px; }
  }

  /* Bubble Shot game */
  .bubble-game {
    width: 100%;
    display: flex;
    flex-direction: column;

    position: absolute;

  .pop-spray i:nth-child(6)  { --drop-x: 76px;   --drop-y: 92px;  --drop-size: 7px;  --drop-angle: 140deg; --drop-delay: 45ms; }

  .pop-spray i:nth-child(10) { --drop-x: 28px;   --drop-y: -119px;--drop-size: 7px;  --drop-angle: 12deg; --drop-delay: 50ms; }
  .pop-spray i:nth-child(11) { --drop-x: -35px;  --drop-y: -112px;--drop-size: 10px; --drop-angle: -18deg; --drop-delay: 10ms; }

      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  function loadWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}

    let legacyCustom = [];
    try {
      const rawCustom = localStorage.getItem(LEGACY_CUSTOM_KEY);
      if (rawCustom) {
        legacyCustom = JSON.parse(rawCustom);
      } else {
        const rawDeck = localStorage.getItem(LEGACY_DECK_KEY);
        if (rawDeck) {
          const builtInLower = new Set(builtInWords.map((item) => item.word.toLowerCase()));
          legacyCustom = JSON.parse(rawDeck).filter(
            (item) => item && item.word && item.definition && !builtInLower.has(item.word.toLowerCase())
          );
        }
      }
    } catch (e) {}

    const merged = new Map();
    builtInWords.forEach((item) => merged.set(item.word.toLowerCase(), item));
    (legacyCustom || []).forEach((item) => {
      if (item && item.word && item.definition) merged.set(item.word.toLowerCase(), item);
    });
    const initialWords = Array.from(merged.values());
    saveWords(initialWords);
    return initialWords;
  }

  function saveWords(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function getAllWords() {
    return words.slice().sort((a, b) => a.word.localeCompare(b.word));
  }

  function randomSample(items, count) {
    const shuffled = items.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(count, shuffled.length));
  }

  // --- sound effects (synthesized, no audio files needed) ---
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // Ramps gain up then down (instead of jumping straight to peak) so the
  // tone doesn't pop/click at the start or end.
  function playTone(freq, duration, type, peakGain) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(peakGain, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.03);
    } catch (e) {}
  }

  function playFlipSound() {
    playTone(560, 0.09, "sine", 0.06);
  }
  function playGotItSound() {
    playTone(523.25, 0.11, "sine", 0.09);
    setTimeout(() => playTone(659.25, 0.11, "sine", 0.09), 80);
    setTimeout(() => playTone(783.99, 0.16, "sine", 0.09), 160);
  }
  function playAlmostSound() {
    playTone(494, 0.16, "sine", 0.08);
  }
  function playDontKnowSound() {
    playAlmostSound();
  }
  function playClickSound() {
    playTone(700, 0.045, "triangle", 0.04);
  }

  let words = loadWords();
  let deck = randomSample(getAllWords(), SESSION_SIZE);
  let view = "home"; // "home" | "practice" | "dictionary" | "games" | "bubble" | "boss"
  let editingIndex = null;
  let showAddForm = false;

  // practice session state
  let firstSide = "term"; // "term" | "definition"
  let order = [];
  let pos = 0;
  let side = "term"; // currently visible side for current card
  let practiceMode = "random"; // "random" | "missed"
  let score = { gotit: 0, almost: 0, dontknow: 0 };
  let results = {}; // original deck index -> "gotit" | "almost" | "dontknow" | "skipped"

  let bubbleGame = {
    score: 0,
    attempts: 0,
    streak: 0,
    answer: null,
    choices: [],
    selectedWord: null,
    feedback: "",
    feedbackType: "",
    locked: false,
    paused: false,
    roundStartedAt: 0,
    elapsed: 0
  };

  let bubbleTimerId = null;
  let bubblePhysicsFrame = null;
  let bubblePhysicsBodies = [];

  const bw = (word, definition) => ({ word, definition });
  const battleCards = [
    { id: "tackle", name: "Tackle", type: "attack", icon: "⚔️", cost: 1, effect: "Deal 6 damage.", words: [
      bw("Belligerent", "Hostile and eager to fight."), bw("Clandestine", "Kept secret or done secretly."), bw("Debilitate", "To make someone or something weak."), bw("Ephemeral", "Lasting for a very short time."), bw("Aggressive", "Ready or likely to attack or confront.")
    ]},
    { id: "heavy", name: "Heavy Strike", type: "attack", icon: "🔨", cost: 2, effect: "Deal 14 damage.", words: [
      bw("Ferocious", "Savagely fierce or violent."), bw("Brutal", "Extremely harsh or violent."), bw("Formidable", "Inspiring fear or respect through great strength."), bw("Ruthless", "Having no pity or compassion."), bw("Vehement", "Showing strong and forceful feeling.")
    ]},
    { id: "quick", name: "Quick Slash", type: "attack", icon: "🗡️", cost: 1, effect: "Deal 6 damage and draw 1 card.", words: [
      bw("Nimble", "Quick and light in movement or thought."), bw("Brisk", "Quick, energetic, and active."), bw("Agile", "Able to move quickly and easily."), bw("Deft", "Skillful, quick, and precise."), bw("Expeditious", "Done with speed and efficiency.")
    ]},
    { id: "poison", name: "Poison Dart", type: "attack", icon: "🏹", cost: 1, effect: "Deal 3 damage, then 3 damage for 2 turns.", words: [
      bw("Toxic", "Poisonous or very harmful."), bw("Insidious", "Proceeding gradually but with harmful effects."), bw("Virulent", "Extremely harmful, severe, or poisonous."), bw("Pernicious", "Having a damaging effect, especially gradually."), bw("Noxious", "Harmful, poisonous, or unpleasant.")

  const allBattleWords = battleCards.flatMap((card) => card.words);

  function createBubbleRound() {
    const pool = getAllWords();
    if (pool.length < 4) {
      bubbleGame.answer = null;
      bubbleGame.choices = [];
      return;
    }

    const answer = pool[Math.floor(Math.random() * pool.length)];
    const decoys = randomSample(
      pool.filter((item) => item.word.toLowerCase() !== answer.word.toLowerCase()),
      3
    );

    bubbleGame.answer = answer;
    bubbleGame.choices = randomSample([answer, ...decoys], 4);
    bubbleGame.selectedWord = null;
    bubbleGame.feedback = "";
    bubbleGame.feedbackType = "";
    bubbleGame.locked = false;
    bubbleGame.paused = false;
    bubbleGame.elapsed = 0;
    bubbleGame.roundStartedAt = performance.now();
  }

  function stopBubbleTimer() {
    if (bubbleTimerId) {
      clearInterval(bubbleTimerId);
      bubbleTimerId = null;
    }
  }

  function pauseBubbleGame(shouldRender = true) {
    if (!bubbleGame.answer || bubbleGame.paused || bubbleGame.locked) return;
    bubbleGame.elapsed = Math.max(0, (performance.now() - bubbleGame.roundStartedAt) / 1000);
    bubbleGame.paused = true;
    stopBubbleTimer();
    stopBubblePhysics();
    if (shouldRender && view === "bubble") render();
  }

  function resumeBubbleGame() {
    bubbleGame.paused = false;
    bubbleGame.roundStartedAt = performance.now() - bubbleGame.elapsed * 1000;
    render();
  }

  function stopBubblePhysics() {
    if (bubblePhysicsFrame) cancelAnimationFrame(bubblePhysicsFrame);
    bubblePhysicsFrame = null;
    bubblePhysicsBodies = [];
  }

  function startBubblePhysics(field) {
    stopBubblePhysics();
    const bubbles = [...field.querySelectorAll(".word-bubble")];
    if (!bubbles.length) return;

    const fieldWidth = field.clientWidth;
    const fieldHeight = field.clientHeight;
    const starts = [
      [0.08, 0.08], [0.72, 0.1], [0.12, 0.64], [0.7, 0.62]
    ];
    const speedFactor = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.35 : 1;

    bubblePhysicsBodies = bubbles.map((element, index) => {
      const size = element.offsetWidth;
      const angle = Math.random() * Math.PI * 2;
      const speed = (34 + Math.random() * 24) * speedFactor;
      const x = Math.min(fieldWidth - size, Math.max(0, starts[index][0] * fieldWidth));
      const y = Math.min(fieldHeight - size, Math.max(0, starts[index][1] * fieldHeight));
      element.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      return { element, x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size };
    });

    let lastTime = performance.now();
    const step = (now) => {
      const dt = Math.min((now - lastTime) / 1000, 0.032);
      lastTime = now;

      for (const body of bubblePhysicsBodies) {
        if (body.element.classList.contains("hit")) continue;
        body.x += body.vx * dt;
        body.y += body.vy * dt;
        if (body.x <= 0 || body.x + body.size >= fieldWidth) {
          body.x = Math.max(0, Math.min(fieldWidth - body.size, body.x));
          body.vx *= -1;
        }
        if (body.y <= 0 || body.y + body.size >= fieldHeight) {
          body.y = Math.max(0, Math.min(fieldHeight - body.size, body.y));
          body.vy *= -1;
        }
      }

      for (let i = 0; i < bubblePhysicsBodies.length; i++) {
        const a = bubblePhysicsBodies[i];
        if (a.element.classList.contains("hit")) continue;
        for (let j = i + 1; j < bubblePhysicsBodies.length; j++) {
          const b = bubblePhysicsBodies[j];
          if (b.element.classList.contains("hit")) continue;
          const dx = (b.x + b.size / 2) - (a.x + a.size / 2);
          const dy = (b.y + b.size / 2) - (a.y + a.size / 2);
          const distance = Math.hypot(dx, dy) || 0.001;
          const minimum = (a.size + b.size) / 2;
          if (distance >= minimum) continue;

          const nx = dx / distance;
          const ny = dy / distance;
          const overlap = minimum - distance;
          a.x -= nx * overlap / 2;
          a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2;
          b.y += ny * overlap / 2;
          const approachSpeed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (approachSpeed < 0) {
            a.vx += approachSpeed * nx;
            a.vy += approachSpeed * ny;
            b.vx -= approachSpeed * nx;
            b.vy -= approachSpeed * ny;
          }
        }
      }

      for (const body of bubblePhysicsBodies) {
        if (!body.element.classList.contains("hit")) {
          body.element.style.transform = `translate3d(${body.x}px, ${body.y}px, 0)`;
        }
      }
      if (view === "bubble" && field.isConnected) bubblePhysicsFrame = requestAnimationFrame(step);
    };
    bubblePhysicsFrame = requestAnimationFrame(step);
  }

  function startBubbleTimer() {
    stopBubbleTimer();
    if (bubbleGame.locked || bubbleGame.paused || view !== "bubble") return;

    const updateTimer = () => {
      const timer = document.getElementById("roundTimer");
      if (!timer || bubbleGame.locked || bubbleGame.paused || view !== "bubble") {
        stopBubbleTimer();
        return;
      }
      bubbleGame.elapsed = (performance.now() - bubbleGame.roundStartedAt) / 1000;
      timer.textContent = `${bubbleGame.elapsed.toFixed(1)}s`;
    };

    updateTimer();
    bubbleTimerId = setInterval(updateTimer, 100);
  }

  function resetBubbleGame() {
    stopBubbleTimer();
    bubbleGame.score = 0;
    bubbleGame.attempts = 0;
    bubbleGame.streak = 0;
    bubbleGame.paused = false;
    createBubbleRound();
  }

  function shuffleBattleDeck(items) {
    return randomSample(items, items.length);
  }

  function createBattleCard(card, uid) {
    return { ...card, uid, vocab: card.words[Math.floor(Math.random() * card.words.length)] };
  }

  function chooseBossIntent() {
    const intents = [
      { type: "attack", value: 9, label: "Strike for 9 damage" },
      { type: "attack", value: 12, label: "Crushing attack for 12 damage" },
      { type: "heal", value: 8, label: "Restore 8 health" },
      { type: "shield", value: 10, label: "Gain 10 shield" },
      { type: "attack", value: 8, label: "Quick attack for 8 damage" }
    ];
    return intents[Math.floor(Math.random() * intents.length)];
  }

  function drawBattleCards(count) {
    for (let i = 0; i < count && battleState.hand.length < 7; i++) {
      if (!battleState.drawPile.length) {
        if (!battleState.discard.length) return;
        battleState.drawPile = shuffleBattleDeck(battleState.discard);
        battleState.discard = [];
      }
      const definition = battleState.drawPile.pop();
      battleState.hand.push(createBattleCard(definition, battleState.nextUid++));
    }
  }

  function startBossBattle() {
    battleState = {
      playerHp: 40, playerMaxHp: 40, shield: 0,
      bossHp: 50, bossMaxHp: 50, bossShield: 0,
      energy: 3, turn: 1, nextUid: 1,
      hand: [], drawPile: shuffleBattleDeck(battleCards), discard: [],
      question: null, message: "Choose a card, then prove you know its word.",
      poisonTurns: 0, poisonDamage: 0, bossWeak: 0,
      evade: false, counter: 0, focusNext: false,
      attackBonus: 0, cancelBoss: false, intentRevealed: false,
      bossIntent: chooseBossIntent(), result: null
    };
    drawBattleCards(5);
  }

  function healPlayer(amount) {
    battleState.playerHp = Math.min(battleState.playerMaxHp, battleState.playerHp + amount);
  }

  function damageBoss(amount) {
    const blocked = Math.min(battleState.bossShield, amount);
    battleState.bossShield -= blocked;
    const healthDamage = amount - blocked;
    battleState.bossHp = Math.max(0, battleState.bossHp - healthDamage);
    return healthDamage;
  }

  function attackBoss(amount) {
    const total = amount + battleState.attackBonus;
    battleState.attackBonus = 0;
    return damageBoss(total);
  }

  function takeBossAttack(amount) {
    if (battleState.evade) {
      battleState.evade = false;
      return "You evaded the attack.";
    }
    const weakened = Math.max(0, amount - battleState.bossWeak);
    battleState.bossWeak = 0;
    const blocked = Math.min(battleState.shield, weakened);
    battleState.shield -= blocked;
    const damage = weakened - blocked;
    battleState.playerHp = Math.max(0, battleState.playerHp - damage);
    if (battleState.counter) {
      damageBoss(battleState.counter);
      battleState.counter = 0;
    }
    return `${blocked ? `Blocked ${blocked}. ` : ""}Took ${damage} damage.`;
  }

  function applyBattleCard(card) {
    let result = "";
    switch (card.id) {
      case "tackle": result = `Tackle dealt ${attackBoss(6)} damage.`; break;
      case "heavy": result = `Heavy Strike dealt ${attackBoss(14)} damage.`; break;
      case "quick": result = `Quick Slash dealt ${attackBoss(6)} damage. Drew a card.`; drawBattleCards(1); break;
      case "poison":
        result = `Poison Dart dealt ${attackBoss(3)} damage and poisoned the boss.`;
        battleState.poisonTurns = 2; battleState.poisonDamage = 3; break;
      case "debilitating": result = `The blow dealt ${attackBoss(7)} damage and weakened the boss.`; battleState.bossWeak = 4; break;
      case "reckless":
        result = `Reckless Charge dealt ${attackBoss(16)} damage, but cost 4 health.`;
        battleState.playerHp = Math.max(0, battleState.playerHp - 4); break;
      case "relentless": result = `Relentless Assault dealt ${attackBoss(21)} total damage.`; break;
      case "shield": battleState.shield += 6; result = "Gained 6 shield."; break;
      case "barrier": battleState.shield += 12; result = "Gained 12 shield."; break;
      case "parry": battleState.shield += 5; battleState.counter = 5; result = "Gained 5 shield and prepared a 5-damage counter."; break;
      case "evasion": battleState.evade = true; result = "The next attack will miss."; break;
      case "fortify":
        battleState.playerMaxHp += 2; battleState.playerHp += 2; battleState.shield += 8;
        result = "Gained 8 shield and 2 maximum health."; break;
      case "mend": healPlayer(6); result = "Restored 6 health."; break;
      case "second-wind": healPlayer(10); battleState.energy += 1; result = "Restored 10 health and regained 1 energy."; break;
      case "compassion": healPlayer(5); battleState.shield += 3; result = "Restored 5 health and gained 3 shield."; break;
      case "vital": healPlayer(16); result = "Restored 16 health."; break;
      case "focus": battleState.focusNext = true; result = "The next vocabulary question will have only 2 choices."; break;
      case "insight": battleState.intentRevealed = true; drawBattleCards(1); result = "Revealed the boss's move and drew a card."; break;
      case "rally": battleState.energy += 1; battleState.attackBonus += 5; result = "Regained 1 energy; the next attack gains 5 damage."; break;
      case "disrupt": battleState.cancelBoss = true; result = "The boss's next move is cancelled."; break;
    }
    return result;
  }

  function askBattleQuestion(uid) {
    if (!battleState || battleState.question || battleState.result) return;
    const card = battleState.hand.find((item) => item.uid === uid);
    if (!card || card.cost > battleState.energy) {
      battleState.message = "You do not have enough energy for that card.";
      render();
      return;
    }
    const choiceCount = battleState.focusNext ? 2 : 4;
    const decoys = randomSample(
      allBattleWords.filter((item) => item.word !== card.vocab.word && item.definition !== card.vocab.definition),
      choiceCount - 1
    );
    battleState.question = {
      uid,
      word: card.vocab.word,
      correctDefinition: card.vocab.definition,
      choices: randomSample([card.vocab, ...decoys], choiceCount)
    };
    battleState.focusNext = false;
    render();
  }

  function resolveBattleQuestion(definition) {
    if (!battleState?.question) return;
    const question = battleState.question;
    const cardIndex = battleState.hand.findIndex((item) => item.uid === question.uid);
    if (cardIndex < 0) return;
    const card = battleState.hand[cardIndex];
    const correct = definition === question.correctDefinition;
    battleState.energy = Math.max(0, battleState.energy - card.cost);
    battleState.hand.splice(cardIndex, 1);
    battleState.discard.push(battleCards.find((item) => item.id === card.id));
    battleState.question = null;

    if (correct) {
      battleState.message = `Correct — ${applyBattleCard(card)}`;
      playGotItSound();
    } else {
      battleState.message = `Not quite. ${card.vocab.word} means “${card.vocab.definition}” The card was discarded.`;
      playDontKnowSound();
    }

    if (battleState.bossHp <= 0) battleState.result = "victory";
    if (battleState.playerHp <= 0) battleState.result = "defeat";
    render();
  }

  function endBattleTurn() {
    if (!battleState || battleState.question || battleState.result) return;
    let message = "";
    if (battleState.poisonTurns > 0) {
      const poisonHit = damageBoss(battleState.poisonDamage);
      battleState.poisonTurns--;
      message += `Poison dealt ${poisonHit} health damage. `;
    }

    if (battleState.bossHp <= 0) {
      battleState.result = "victory";
      render();
      return;
    }

    if (battleState.cancelBoss) {
      message += "The boss's move was disrupted.";
      battleState.cancelBoss = false;
    } else if (battleState.bossIntent.type === "heal") {
      battleState.bossHp = Math.min(battleState.bossMaxHp, battleState.bossHp + battleState.bossIntent.value);
      message += `The boss restored ${battleState.bossIntent.value} health.`;
    } else if (battleState.bossIntent.type === "shield") {
      battleState.bossShield = Math.min(20, battleState.bossShield + battleState.bossIntent.value);
      message += `The boss gained ${battleState.bossIntent.value} shield.`;
    } else {
      message += takeBossAttack(battleState.bossIntent.value);
    }

    battleState.shield = 0;
    if (battleState.playerHp <= 0) {
      battleState.result = "defeat";
    } else if (battleState.bossHp <= 0) {
      battleState.result = "victory";
    } else {
      battleState.turn++;
      battleState.energy = 3;
      battleState.intentRevealed = false;
      battleState.bossIntent = chooseBossIntent();
      drawBattleCards(5 - battleState.hand.length);
      battleState.message = message;
    }
    render();
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    side = firstSide;
  }

  resetPracticeSession();

  function render() {
    if (view !== "bubble") {
      app.classList.remove("bubble-fullscreen");
      if (document.fullscreenElement === app) document.exitFullscreen().catch(() => {});
    }
    if (view !== "bubble" && bubbleGame.answer && !bubbleGame.paused) {
      if (bubbleGame.locked) {
        createBubbleRound();
        bubbleGame.paused = true;
      } else {
        pauseBubbleGame(false);
      }
    }
    stopBubbleTimer();
    stopBubblePhysics();
    app.classList.toggle("battle-mode", view === "boss");
    if (view === "home") {
      renderHome();
      return;
    }

    const backToGames = view === "bubble" || view === "boss";
    app.innerHTML = `
      <button class="back-home-btn" id="backHome">&#8249; Back to ${backToGames ? "Games" : "Home"}</button>
      <div id="viewRoot" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;"></div>
    `;

    app.querySelector("#backHome").addEventListener("click", () => {
      playClickSound();
      view = backToGames ? "games" : "home";
      render();
    });

    const root = document.getElementById("viewRoot");
    if (view === "practice") {
      renderPractice(root);
    } else if (view === "dictionary") {
      renderDictionary(root);
    } else if (view === "games") {
      renderGameMenu(root);
    } else if (view === "bubble") {
      renderGames(root);
    } else if (view === "boss") {
      renderBossBattle(root);
    }
  }

  function renderHome() {
    app.innerHTML = `

  function battleStatusText() {
    const statuses = [];
    if (battleState.poisonTurns) statuses.push(`Boss poisoned: ${battleState.poisonTurns} turn${battleState.poisonTurns === 1 ? "" : "s"}`);
    if (battleState.attackBonus) statuses.push(`Next attack +${battleState.attackBonus}`);
    if (battleState.evade) statuses.push("Evasion ready");
    if (battleState.counter) statuses.push(`Counter: ${battleState.counter}`);
    if (battleState.cancelBoss) statuses.push("Disruption ready");
    return statuses.join(" · ") || "No active effects";
  }

    }

    if (bubbleGame.paused) {
      root.innerHTML = `<section class="bubble-game" aria-labelledby="bubbleGameTitle">
        <div class="game-heading">

    root.innerHTML = `
      <section class="bubble-game" aria-labelledby="bubbleGameTitle">
        <div class="game-heading">
          <div>
            <h2 id="bubbleGameTitle">Bubble Shot</h2>
            <p>Shoot the word that matches the definition.</p>

              <button class="small-btn" id="pauseBubble">Pause</button>

          </div>
        </div>

        </div>

        <div class="bubble-field" aria-label="Word choices">
          ${bubbleGame.choices.map((choice, index) => {
            return `
              <button
                class="word-bubble"
                data-choice-index="${index}"
                ${bubbleGame.locked ? "disabled" : ""}
                aria-label="Shoot ${escapeHtml(choice.word)}"
              ><span class="bubble-word">${escapeHtml(choice.word)}</span><span class="pop-spray" aria-hidden="true">${"<i></i>".repeat(12)}</span></button>
            `;
          }).join("")}
          <div class="aim-hint">Aim and shoot</div>
        </div>

        <div class="game-feedback ${bubbleGame.feedbackType}" aria-live="polite">
          ${escapeHtml(bubbleGame.feedback)}
        </div>

        <div class="game-footer">
          <button class="small-btn" id="newBubbleGame">New game</button>
        </div>
      </section>
    `;

    startBubbleTimer();
    const bubbleField = root.querySelector(".bubble-field");
    startBubblePhysics(bubbleField);
    root.querySelector("#pauseBubble").addEventListener("click", () => { playClickSound(); pauseBubbleGame(); });
    root.querySelector("#fullscreenBubble").addEventListener("click", toggleBubbleFullscreen);

    root.querySelectorAll(".word-bubble").forEach((button) => {
      button.addEventListener("click", () => {
        if (bubbleGame.locked) return;

        const choiceIndex = Number(button.getAttribute("data-choice-index"));
        const choice = bubbleGame.choices[choiceIndex];
        const isCorrect = choice.word === bubbleGame.answer.word;
        const elapsed = Math.max(0, (performance.now() - bubbleGame.roundStartedAt) / 1000);

        stopBubbleTimer();
        bubbleGame.locked = true;
        bubbleGame.attempts++;
        bubbleGame.selectedWord = choice.word;
        bubbleGame.elapsed = elapsed;

        if (isCorrect) {
          bubbleGame.streak++;
          const speedPoints = Math.max(100, Math.round(1000 - elapsed * 90));
          const streakBonus = Math.min((bubbleGame.streak - 1) * 25, 250);
          const pointsEarned = speedPoints + streakBonus;
          bubbleGame.score += pointsEarned;
          bubbleGame.feedback = `Bullseye! +${pointsEarned} points in ${elapsed.toFixed(1)}s.`;
          bubbleGame.feedbackType = "correct";
          playGotItSound();
        } else {
          bubbleGame.streak = 0;
          const pointsLost = Math.min(250, bubbleGame.score);
          bubbleGame.score = Math.max(0, bubbleGame.score - 250);
          bubbleGame.feedback = pointsLost
            ? `Wrong bubble: -${pointsLost} points. The answer is ${bubbleGame.answer.word}.`
            : `Wrong bubble. Your score stays at 0. The answer is ${bubbleGame.answer.word}.`;
          bubbleGame.feedbackType = "wrong";
          playDontKnowSound();
        }

        const answeredAttempt = bubbleGame.attempts;
        const field = root.querySelector(".bubble-field");
        const bubbleRect = button.getBoundingClientRect();
        const fieldRect = field.getBoundingClientRect();
        button.style.left = `${bubbleRect.left + bubbleRect.width / 2 - fieldRect.left - button.offsetWidth / 2}px`;
        button.style.top = `${bubbleRect.top + bubbleRect.height / 2 - fieldRect.top - button.offsetHeight / 2}px`;
        button.classList.add(isCorrect ? "correct" : "wrong", "hit");
        if (!isCorrect) {
          const correctIndex = bubbleGame.choices.findIndex((item) => item.word === bubbleGame.answer.word);
          root.querySelector(`.word-bubble[data-choice-index="${correctIndex}"]`)?.classList.add("answer-reveal");
        }
        field.classList.add("round-locked");
        root.querySelectorAll(".word-bubble").forEach((bubble) => bubble.setAttribute("aria-disabled", "true"));
        root.querySelector("#gameScore").textContent = bubbleGame.score;
        root.querySelector("#gameStreak").textContent = bubbleGame.streak;
        root.querySelector("#roundTimer").textContent = `${elapsed.toFixed(1)}s`;
        const feedback = root.querySelector(".game-feedback");
        feedback.className = `game-feedback ${bubbleGame.feedbackType}`;
        feedback.textContent = bubbleGame.feedback;
        setTimeout(() => {
          if (view === "bubble" && bubbleGame.locked && bubbleGame.attempts === answeredAttempt) {
            createBubbleRound();
            render();
          }
        }, 1500);
      });
    });

    root.querySelector("#newBubbleGame").addEventListener("click", () => {
      playClickSound();
      resetBubbleGame();
      render();
    });
  }

      </div>

      firstSide = "term";
      side = "term";
      render();
    });
    topbar.querySelector("#defFirstBtn").addEventListener("click", () => {
      playClickSound();
      firstSide = "definition";
      side = "definition";
      render();
    });

    if (pos >= order.length) {
      const skipped = Object.values(results).filter((result) => result === "skipped").length;
      const missedIndices = Object.keys(results)
        .filter((k) => results[k] !== "gotit")
        .map(Number);

      const done = document.createElement("div");
      done.className = "done";
      done.innerHTML = `
        <h2>Session complete!</h2>
        <p>Got it: ${score.gotit} &nbsp;|&nbsp; Almost: ${score.almost} &nbsp;|&nbsp; Didn't know: ${score.dontknow}</p>
        ${skipped > 0 ? `<p>Skipped: ${skipped}</p>` : ""}

        <div class="results-review">
          <h3>Review your words</h3>

          ${resultGroupHtml("Got it", getResultItems("gotit"), "got-it-group")}
        </div>
      `;
      root.appendChild(done);
      done.querySelector("#restart").addEventListener("click", () => {
        playClickSound();
        resetPracticeSession();
        render();
      });
      const missedBtn = done.querySelector("#practiceMissed");
      if (missedBtn) {
        missedBtn.addEventListener("click", () => {
          playClickSound();
          resetPracticeSession(missedIndices);
          render();
        });
      }
      return;
    }

    const current = deck[order[pos]];
    const progressPct = Math.round((pos / order.length) * 100);
    const frontIsTerm = firstSide === "term";
    const frontLabel = frontIsTerm ? "TERM" : "DEFINITION";
    const frontValue = frontIsTerm ? current.word : current.definition;
    const backLabel = frontIsTerm ? "DEFINITION" : "TERM";
    const backValue = frontIsTerm ? current.definition : current.word;

    const sessionActions = document.createElement("div");
    sessionActions.className = "session-actions";
    sessionActions.innerHTML = `
      <div class="progress-label">${pos + 1} / ${order.length} ${practiceMode === "missed" ? "missed &amp; skipped words" : "random words"}</div>
      <button class="small-btn" id="newSessionBtn">New 10</button>

      generateNewSession();
      render();

    const scene = document.createElement("div");

    scene.setAttribute("role", "button");

          <div>
            <div class="side-label">${frontLabel}</div>
            <div class="${frontIsTerm ? 'word' : 'definition'}">${escapeHtml(frontValue)}</div>
            <div class="hint">Tap to flip</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="side-label">${backLabel}</div>
            <div class="${frontIsTerm ? 'definition' : 'word'}">${escapeHtml(backValue)}</div>
            <div class="hint">Tap to flip back</div>
          </div>
        </div>
      </div>
    `;
    root.appendChild(scene);

    function flipCard() {
      playFlipSound();
      side = side === "term" ? "definition" : "term";
      const inner = document.getElementById("cardInner");
      if (inner) inner.classList.toggle("flip");
      renderRateRow();
    }

    scene.addEventListener("click", flipCard);
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });

    const rateRowContainer = document.createElement("div");
    rateRowContainer.id = "rateRowContainer";
    rateRowContainer.style.width = "100%";

    renderRateRow();

    const navRow = document.createElement("div");

      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next</button>
    `;
    root.appendChild(navRow);
    navRow.querySelector("#prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      pos = Math.max(0, pos - 1);
      side = firstSide;
      render();
    });
    navRow.querySelector("#shuffleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      shuffleOrder();
      render();
    });
    navRow.querySelector("#nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      if (!(order[pos] in results)) results[order[pos]] = "skipped";
      pos++;
      side = firstSide;
      render();
    });

  function renderRateRow() {
    const container = document.getElementById("rateRowContainer");
    if (!container) return;
    if (side === firstSide) {
      container.innerHTML = "";
      return;
    }
    container.innerHTML = `
      <div class="rate-row">
        <button class="dont-know" id="dontKnow">Didn't know</button>
        <button class="almost-btn" id="almost">Almost got it</button>
        <button class="know" id="gotit">Got it</button>
      </div>
    `;
    container.querySelector("#dontKnow").addEventListener("click", (e) => {
      e.stopPropagation();
      playDontKnowSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "dontknow";
      score.dontknow++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#almost").addEventListener("click", (e) => {
      e.stopPropagation();
      playAlmostSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "almost";
      score.almost++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#gotit").addEventListener("click", (e) => {
      e.stopPropagation();
      playGotItSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "gotit";
      score.gotit++;
      pos++;
      side = firstSide;
      render();
    });
  }

            <strong>${editingWord ? 'Edit word' : 'Add a word'}</strong>
            <input type="text" id="newWord" placeholder="Word" />
            <textarea id="newDef" placeholder="Definition" rows="2"></textarea>
            <div class="form-actions">
              <button class="cancel-btn" id="cancelEditBtn">Cancel</button>
              <button class="accent-btn" id="addBtn">${editingWord ? 'Save changes' : 'Add word'}</button>
            </div>
          </div>
        ` : ""}
        <div class="deck-list" id="deckList"></div>
      </div>
    `;

    root.querySelector("#toggleAddBtn").addEventListener("click", () => {
      playClickSound();
      showAddForm = !showAddForm;
      if (!showAddForm) editingIndex = null;
      render();
    });

    if (showAddForm) {
      const wordInput = root.querySelector("#newWord");
      const defInput = root.querySelector("#newDef");
      if (editingWord) {
        wordInput.value = editingWord.word;
        defInput.value = editingWord.definition;
      }
      root.querySelector("#cancelEditBtn").addEventListener("click", () => {
        playClickSound();
        showAddForm = false;
        editingIndex = null;
        render();
      });
      root.querySelector("#addBtn").addEventListener("click", () => {
        const word = wordInput.value.trim();
        const definition = defInput.value.trim();
        if (!word || !definition) return;
        const duplicate = words.some(
          (item, i) => i !== editingIndex && item.word.toLowerCase() === word.toLowerCase()
        );
        if (duplicate) {
          wordInput.setCustomValidity("That word is already in the dictionary.");
          wordInput.reportValidity();
          return;
        }
        playClickSound();
        if (editingIndex === null) {
          words.push({ word, definition });
        } else {
          words[editingIndex] = { word, definition };
        }
        saveWords(words);
        showAddForm = false;
        editingIndex = null;
        generateNewSession();
        render();
      });
    }

    const search = root.querySelector("#dictionarySearch");
    const list = root.querySelector("#deckList");

    function drawList(query = "") {
      const normalized = query.trim().toLowerCase();
      const matches = allWords.filter((item) =>
        !normalized || item.word.toLowerCase().includes(normalized) ||
        item.definition.toLowerCase().includes(normalized)
      );

      if (matches.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching words found.</div>`;
        return;
      }

      list.innerHTML = matches.map((item) => {
        const realIndex = words.indexOf(item);
        return `
          <div class="deck-item">
            <div class="deck-item-text">
              <div class="deck-item-word">${escapeHtml(item.word)}</div>
              <div class="deck-item-def">${escapeHtml(item.definition)}</div>
            </div>
            <div class="deck-item-actions">
              <button class="edit-btn" data-index="${realIndex}" aria-label="Edit ${escapeHtml(item.word)}">Edit</button>
              <button class="delete-btn" data-index="${realIndex}" aria-label="Delete ${escapeHtml(item.word)}">&times;</button>
            </div>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          editingIndex = parseInt(btn.getAttribute("data-index"), 10);
          showAddForm = true;
          render();
          document.getElementById("newWord").focus();
        });
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          const i = parseInt(btn.getAttribute("data-index"), 10);
          words.splice(i, 1);
          if (editingIndex === i) {
            editingIndex = null;
            showAddForm = false;
          } else if (editingIndex !== null && editingIndex > i) {
            editingIndex--;
          }
          saveWords(words);
          generateNewSession();
          render();
        });
      });
    }

    search.addEventListener("input", () => drawList(search.value));
    drawList();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && view === "bubble" && !bubbleGame.paused && !bubbleGame.locked) {
      pauseBubbleGame();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (view === "bubble" && !bubbleGame.paused) {
      requestAnimationFrame(() => {
        const field = document.querySelector(".bubble-field");
        if (field) startBubblePhysics(field);
      });
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && app.classList.contains("bubble-fullscreen")) {
      app.classList.remove("bubble-fullscreen");
      if (view === "bubble" && !bubbleGame.paused) {
        requestAnimationFrame(() => {
          const field = document.querySelector(".bubble-field");
          if (field) startBubblePhysics(field);
        });
      }
    }
  });

  render();
</script>

</body>
</html>
