    const search = root.querySelector("#dictionarySearch");
    const list = root.querySelector("#deckList");

    function drawList(query = "") {
      const normalized = query.trim().toLowerCase();
      const matches = allWords.filter((item) =>
        !normalized || item.word.toLowerCase().includes(normalized) ||
        item.definition.toLowerCase().includes(normalized) ||
        (item.partOfSpeech || "").toLowerCase().includes(normalized)
      );

      if (matches.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching words found.</div>`;
        return;
      }

      list.innerHTML = matches.map((item) => {
        const realIndex = words.indexOf(item);
        const selectionKey = item.word.toLowerCase();
        return `
          <div class="deck-item">
            <label class="word-selector">
              <input type="checkbox" class="word-select-checkbox" data-index="${realIndex}" ${selectedDictionaryKeys.has(selectionKey) ? "checked" : ""} aria-label="Select ${escapeHtml(item.word)}">
              <span class="deck-item-text"><span class="deck-item-word">${escapeHtml(item.word)}</span><span class="part-of-speech">${escapeHtml(item.partOfSpeech || "Not specified")}</span><span class="deck-item-def">${escapeHtml(item.definition)}</span></span>
            </label>
            <div class="deck-item-actions">
              <button class="edit-btn" data-index="${realIndex}" aria-label="Edit ${escapeHtml(item.word)}">Edit</button>
              <button class="delete-btn" data-index="${realIndex}" aria-label="Delete ${escapeHtml(item.word)}">&times;</button>
            </div>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".word-select-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const item = words[Number(checkbox.dataset.index)];
          if (!item) return;
          const key = item.word.toLowerCase();
          if (checkbox.checked) selectedDictionaryKeys.add(key);
          else selectedDictionaryKeys.delete(key);
          updateSelectionTray();
        });
      });

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          editingIndex = parseInt(btn.getAttribute("data-index"), 10);
          showAddForm = true;
          render();
          document.getElementById("newWord").focus();
        });
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          const listScrollPosition = list.scrollTop;
          const pageScrollPosition = window.scrollY;
          const i = parseInt(btn.getAttribute("data-index"), 10);
          const deletedKey = words[i].word.toLowerCase();
          selectedDictionaryKeys.delete(deletedKey);
          removeWordFromBatches(deletedKey);
          words.splice(i, 1);
          if (editingIndex === i) {
            editingIndex = null;
            showAddForm = false;
          } else if (editingIndex !== null && editingIndex > i) {
            editingIndex--;
          }
          saveWords(words);
          generateNewSession();
          render();
          requestAnimationFrame(() => {
            const refreshedList = document.getElementById("deckList");
            if (refreshedList) refreshedList.scrollTop = listScrollPosition;
            window.scrollTo(0, pageScrollPosition);
          });
        });
      });
    }

    search.addEventListener("input", () => {
      dictionarySearchQuery = search.value;
      drawList(dictionarySearchQuery);
    });
    drawList(dictionarySearchQuery);
    updateSelectionTray();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

  function capitalizeDictation(text) {
    return text.replace(/[A-Za-z]/, (letter) => letter.toUpperCase());
  }

  function attachDictation(button, targetField) {
    if (!button) return;
    if (!SpeechRecognitionCtor) {
      button.remove();
      return;
    }

    let recognition = null;
    let listening = false;

    button.addEventListener("click", (e) => {
      e.preventDefault();
      if (listening) {
        recognition && recognition.stop();
        return;
      }
      playClickSound();
      recognition = new SpeechRecognitionCtor();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        button.classList.add("listening");
      };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          targetField.value = capitalizeDictation(transcript);
          targetField.focus();
        }
      };
      recognition.onerror = () => {
        listening = false;
        button.classList.remove("listening");
      };
      recognition.onend = () => {
        listening = false;
        button.classList.remove("listening");
      };

      try {
        recognition.start();
      } catch (e) {}
    });
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && view === "bubble" && !bubbleGame.paused && !bubbleGame.locked) {
      pauseBubbleGame();
    }
    if (document.hidden && view === "whack" && !whackGame.paused && !whackGame.locked) {
      pauseWhackGame();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (view === "bubble" && !bubbleGame.paused) {
      requestAnimationFrame(() => {
        const field = document.querySelector(".bubble-field");
        if (field) startBubblePhysics(field);
      });
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && app.classList.contains("bubble-fullscreen")) {
      app.classList.remove("bubble-fullscreen");
      if (view === "bubble" && !bubbleGame.paused) {
        requestAnimationFrame(() => {
          const field = document.querySelector(".bubble-field");
          if (field) startBubblePhysics(field);
        });
      }
    }
    if (event.key === "Escape" && app.classList.contains("whack-fullscreen")) {
      app.classList.remove("whack-fullscreen");
    }
    if (view === "practice" && !["INPUT", "TEXTAREA"].includes(event.target.tagName)) {
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        document.querySelector(".card-scene")?.click();
      } else if (event.key === "ArrowLeft") {
        document.getElementById("prevBtn")?.click();
      } else if (event.key === "ArrowRight") {
        document.getElementById("nextBtn")?.click();
      } else if (event.key === "1") {
        document.getElementById("dontKnow")?.click();
      } else if (event.key === "2") {
        document.getElementById("almost")?.click();
      } else if (event.key === "3") {
        document.getElementById("gotit")?.click();
      }
    }
  });

  seedAchievementHistory();
  render();
</script>

</body>
</html>
