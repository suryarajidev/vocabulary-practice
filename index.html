<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardstack</title>
<style>
  :root {
    --bg: #f0ebdd;
    --text: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #fdfcf9;
    --border: #e5e1d3;
    --accent: #0d9488;
    --teal: #0d9488;
    --good: #16a34a;
    --almost: #b45309;
    --bad: #dc2626;
    --brand-dark: #04342c;
    --brand-muted: #4a6b62;
    --brand-icon: #085041;
    --teal-hero: #0f6e56;
    --chip-bg: #e1f5ee;
  }

  * { box-sizing: border-box; }

  button,
  .side-toggle-btn,
  .card-scene {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  .side-toggle-btn {
    transition: transform 0.16s ease, box-shadow 0.16s ease,
      background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    transform: translateY(0) scale(1);
  }

  button:hover,
  .side-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(13, 148, 136, 0.14);
  }

  button:active,
  .side-toggle-btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(13, 148, 136, 0.12);
    transition-duration: 0.07s;
  }

  button:focus-visible,
  .side-toggle-btn:focus-visible,
  .card-scene:focus-visible {
    outline: 3px solid rgba(13, 148, 136, 0.35);
    outline-offset: 3px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: auto;
  }

  .back-home-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--teal);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px 2px;
  }

  .home-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .home-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .home-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--brand-dark);
  }

  .home-welcome {
    font-size: 16px;
    font-weight: 400;
    color: var(--brand-muted);
  }

  .brand-bar {
    padding: 36px 0 28px;
    text-align: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 800;
    color: var(--brand-dark);
    letter-spacing: -0.01em;
  }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .home-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px 24px;
    min-height: 150px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
  }

  .home-card.hero {
    background: var(--teal-hero);
    border-color: var(--teal-hero);
  }

  .home-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 26px rgba(13, 148, 136, 0.14);
  }

  .home-card-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--chip-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-icon);
    margin-bottom: 22px;
  }

  .home-card-icon svg {
    width: 26px;
    height: 26px;
  }

  .home-card-title {
    font-size: 21px;
    font-weight: 800;
    color: var(--brand-dark);
    margin: 0 0 6px;
  }

  .home-card-body {
    font-size: 14px;
    color: var(--brand-muted);
    line-height: 1.5;
    margin: 0;
  }

  .home-card.hero .home-card-title {
    color: var(--card-bg);
  }

  .home-card.hero .home-card-body {
    color: #9fe1cb;
  }

  .practice-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .side-toggle {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .side-toggle-btn {
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }

  .side-toggle-btn.active {
    background: var(--teal);
    color: white;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 14px;
    color: var(--muted);
    align-self: center;
  }

  .card-scene {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 320px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .card-scene:hover {
    transform: translateY(-3px);
  }

  .card-scene:active {
    transform: translateY(0) scale(0.99);
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 320px;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card-inner.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 26px 22px;
    backface-visibility: hidden;
    user-select: none;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    border-top: 4px solid transparent;
  }

  .card-front {
    background: var(--card-bg);
    border-top-color: var(--accent);
  }

  .card-back {
    background: #e6f7f3;
    border-top-color: var(--teal);
    transform: rotateY(180deg);
  }

  .side-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .word {
    font-size: 36px;
    font-weight: 700;
  }

  .definition {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.35;
  }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }

  .rate-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .rate-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  .dont-know {
    background: #fee2e2;
    color: var(--bad);
  }

  .almost-btn {
    background: #fef3c7;
    color: var(--almost);
  }

  .know {
    background: #dcfce7;
    color: var(--good);
  }

  .nav-row {
    width: 100%;
    display: flex;
    gap: 12px;
  }

  .nav-row button {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .accent-btn {
    background: var(--accent);
    color: white;
    border: none;
    font-size: 18px;
    font-weight: 600;
    padding: 18px 0;
    border-radius: 12px;
    cursor: pointer;
  }

  .done {
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .done h2 {
    font-size: 26px;
    margin-bottom: 4px;
  }

  .done p {
    font-size: 17px;
  }

  .restart-btn {
    color: white;
    border: none;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 28px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
    margin: 10px 0 18px;
    background: linear-gradient(135deg, var(--accent), #0f766e);
    box-shadow: 0 8px 20px rgba(13, 148, 136, 0.24);
    letter-spacing: 0.01em;
  }

  .restart-btn:hover {
    box-shadow: 0 12px 26px rgba(13, 148, 136, 0.3);
  }

  .missed-btn {
    background: #fef3c7;
    color: var(--almost);
    border: none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    white-space: nowrap;
  }

  .results-review {
    display: flex;
    flex-direction: column;
    gap: 9px;
    text-align: left;
  }

  .results-review h3 {
    margin: 4px 0;
    text-align: center;
  }

  .result-group {
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card-bg);
    overflow: hidden;
  }

  .result-group summary {
    padding: 12px 14px;
    cursor: pointer;
    font-weight: 750;
    list-style-position: inside;
    transition: background-color 0.16s ease;
  }

  .result-group summary:hover {
    background: rgba(13, 148, 136, 0.06);
  }

  .result-group.dont-know-group summary { color: var(--bad); }
  .result-group.almost-group summary { color: var(--almost); }
  .result-group.got-it-group summary { color: var(--good); }

  .result-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 12px 12px;
  }

  .result-item {
    border-top: 1px solid var(--border);
    padding: 10px 2px 2px;
  }

  .result-word {
    font-weight: 750;
    margin-bottom: 3px;
  }

  .result-definition {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .result-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 2px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  /* Dictionary view */
  .manage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .dictionary-header h2 {
    margin: 0 0 4px;
  }

  .dictionary-header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .dictionary-toolbar {
    width: 100%;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .dictionary-search {
    flex: 1;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    outline: none;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .add-form input,
  .add-form textarea {
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    resize: vertical;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 3px;
  }

  .deck-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .deck-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .deck-item-word {
    font-weight: 700;
    font-size: 15px;
  }

  .deck-item-def {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    color: var(--bad);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
    border: none;
    cursor: pointer;
  }

  .deck-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .edit-btn {
    background: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .form-actions button {
    flex: 1;
  }

  .cancel-btn {
    background: var(--card-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .deck-count {
    font-size: 13px;
    color: var(--muted);
  }

  .session-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .small-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--teal);
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Bubble Shot game */
  .bubble-game {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .game-heading h2 { margin: 0 0 4px; }
  .game-heading p { margin: 0; color: var(--muted); font-size: 13px; }

  .game-stats {
    display: flex;
    gap: 8px;
  }

  .stat-pill {
    min-width: 62px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    text-align: center;
  }

  .stat-pill strong,
  .stat-pill span { display: block; }
  .stat-pill strong { color: var(--accent); font-size: 18px; }
  .stat-pill span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }

  .definition-prompt {
    padding: 22px 20px;
    border-radius: 15px;
    background: linear-gradient(135deg, #eef4ff, #e7faf6);
    border: 1px solid rgba(13, 148, 136, 0.16);
    text-align: center;
    box-shadow: 0 8px 20px rgba(13, 148, 136, 0.08);
  }

  .definition-prompt .side-label { margin-bottom: 9px; }
  .definition-prompt p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.42; }

  .bubble-field {
    position: relative;
    width: 100%;
    height: 480px;
    overflow: hidden;
    border: 1px solid rgba(13, 148, 136, 0.16);
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(231, 250, 255, 0.04), rgba(21, 80, 48, 0.12)),
      url("assets/bubble-meadow.png") center / cover no-repeat;
    cursor: crosshair;
    box-shadow: inset 0 0 35px rgba(13, 148, 136, 0.06);
  }

  .word-bubble {
    position: absolute;
    left: 0;
    top: 0;
    width: 148px;
    height: 148px;
    display: grid;
    place-items: center;
    padding: 20px 12px;
    border: 2px solid rgba(255, 255, 255, 0.72);
    border-radius: 50%;
    color: #15325b;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.15;
    text-align: center;
    cursor: crosshair;
    box-shadow: inset -8px -10px 18px rgba(13, 148, 136, 0.12),
      inset 7px 8px 14px rgba(255, 255, 255, 0.7),
      0 10px 22px rgba(13, 148, 136, 0.14);
    will-change: transform;
  }

  .word-bubble::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 13%;
    top: 17%;
    left: 22%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.64);
    transform: rotate(-22deg);
    pointer-events: none;
  }

  .word-bubble:nth-child(1) { background: linear-gradient(145deg, #cdeee5, #93e2cf); }
  .word-bubble:nth-child(2) { background: linear-gradient(145deg, #c9f4e8, #6fd0ba); }
  .word-bubble:nth-child(3) { background: linear-gradient(145deg, #fce2b7, #f7c978); }
  .word-bubble:nth-child(4) { background: linear-gradient(145deg, #ede6d3, #d8ceac); }

  .bubble-field:not(.round-locked) .word-bubble:hover {
    filter: brightness(1.08);
    box-shadow: inset -8px -10px 18px rgba(13, 148, 136, 0.12),
      inset 7px 8px 14px rgba(255, 255, 255, 0.7),
      0 16px 28px rgba(13, 148, 136, 0.2);
  }

  .word-bubble.correct {
    background: #bbf7d0;
    border-color: var(--good);
    color: #14532d;
    animation: none;
  }

  .word-bubble.wrong {
    background: #fecaca;
    border-color: var(--bad);
    color: #7f1d1d;
    animation: none;
  }

  .word-bubble:disabled { cursor: default; opacity: 0.72; }
  .word-bubble.correct:disabled,
  .word-bubble.wrong:disabled { opacity: 1; }

  .word-bubble.hit {
    pointer-events: none;
    animation: bubblePop 760ms cubic-bezier(0.16, 0.8, 0.3, 1) forwards !important;
    z-index: 4;
  }

  .word-bubble.answer-reveal {
    animation: correctReveal 620ms ease-in-out 2;
    border-color: var(--good);
  }

  .word-bubble.hit::before {
    content: "";
    position: absolute;
    inset: -18px;
    border: 5px solid rgba(255, 255, 255, 0.92);
    border-radius: 50%;
    opacity: 0;
    animation: bubbleRipple 560ms ease-out forwards;
  }

  .bubble-word { position: relative; z-index: 1; }

  .pop-spray {
    position: absolute;
    inset: 50%;
    pointer-events: none;
    z-index: 5;
  }

  .pop-spray i {
    position: absolute;
    width: calc(var(--drop-size, 9px) * 1.35);
    height: calc(var(--drop-size, 9px) * 1.8);
    border-radius: 55% 45% 58% 42%;
    border: 1px solid rgba(255, 255, 255, 0.82);
    background: linear-gradient(145deg, #ffffff, rgba(69, 177, 255, 0.92));
    box-shadow: inset 2px 2px 3px rgba(255,255,255,0.82), 0 3px 7px rgba(13,84,145,0.34);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.3) rotate(var(--drop-angle));
  }

  .word-bubble.hit .pop-spray i {
    animation: dropletFly 1050ms cubic-bezier(0.12, 0.68, 0.28, 1) var(--drop-delay, 0ms) forwards;
  }

  .pop-spray i:nth-child(1)  { --drop-x: -108px; --drop-y: -62px; --drop-size: 11px; --drop-angle: -55deg; }
  .pop-spray i:nth-child(2)  { --drop-x: -128px; --drop-y: -8px;  --drop-size: 7px;  --drop-angle: -78deg; --drop-delay: 35ms; }
  .pop-spray i:nth-child(3)  { --drop-x: -102px; --drop-y: 58px;  --drop-size: 9px;  --drop-angle: -120deg; --drop-delay: 20ms; }
  .pop-spray i:nth-child(4)  { --drop-x: -45px;  --drop-y: 105px; --drop-size: 6px;  --drop-angle: -150deg; --drop-delay: 55ms; }
  .pop-spray i:nth-child(5)  { --drop-x: 12px;   --drop-y: 122px; --drop-size: 10px; --drop-angle: 175deg; --drop-delay: 15ms; }
  .pop-spray i:nth-child(6)  { --drop-x: 76px;   --drop-y: 92px;  --drop-size: 7px;  --drop-angle: 140deg; --drop-delay: 45ms; }
  .pop-spray i:nth-child(7)  { --drop-x: 120px;  --drop-y: 44px;  --drop-size: 11px; --drop-angle: 105deg; }
  .pop-spray i:nth-child(8)  { --drop-x: 132px;  --drop-y: -25px; --drop-size: 6px;  --drop-angle: 72deg; --drop-delay: 60ms; }
  .pop-spray i:nth-child(9)  { --drop-x: 91px;   --drop-y: -93px; --drop-size: 9px;  --drop-angle: 38deg; --drop-delay: 25ms; }
  .pop-spray i:nth-child(10) { --drop-x: 28px;   --drop-y: -119px;--drop-size: 7px;  --drop-angle: 12deg; --drop-delay: 50ms; }
  .pop-spray i:nth-child(11) { --drop-x: -35px;  --drop-y: -112px;--drop-size: 10px; --drop-angle: -18deg; --drop-delay: 10ms; }

  function loadWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}

    let legacyCustom = [];
    try {
      const rawCustom = localStorage.getItem(LEGACY_CUSTOM_KEY);
      if (rawCustom) {
        legacyCustom = JSON.parse(rawCustom);
      } else {
        const rawDeck = localStorage.getItem(LEGACY_DECK_KEY);
        if (rawDeck) {
          const builtInLower = new Set(builtInWords.map((item) => item.word.toLowerCase()));
          legacyCustom = JSON.parse(rawDeck).filter(
            (item) => item && item.word && item.definition && !builtInLower.has(item.word.toLowerCase())
          );
        }
      }
    } catch (e) {}

    const merged = new Map();
    builtInWords.forEach((item) => merged.set(item.word.toLowerCase(), item));
    (legacyCustom || []).forEach((item) => {
      if (item && item.word && item.definition) merged.set(item.word.toLowerCase(), item);
    });
    const initialWords = Array.from(merged.values());
    saveWords(initialWords);
    return initialWords;
  }

  function saveWords(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function getAllWords() {
    return words.slice().sort((a, b) => a.word.localeCompare(b.word));
  }

  function randomSample(items, count) {
    const shuffled = items.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(count, shuffled.length));
  }

  // --- sound effects (synthesized, no audio files needed) ---
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // Ramps gain up then down (instead of jumping straight to peak) so the
  // tone doesn't pop/click at the start or end.
  function playTone(freq, duration, type, peakGain) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(peakGain, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.03);
    } catch (e) {}
  }

  function playFlipSound() {
    playTone(560, 0.09, "sine", 0.06);
  }
  function playGotItSound() {
    playTone(523.25, 0.11, "sine", 0.09);
    setTimeout(() => playTone(659.25, 0.11, "sine", 0.09), 80);
    setTimeout(() => playTone(783.99, 0.16, "sine", 0.09), 160);
  }
  function playAlmostSound() {
    playTone(494, 0.16, "sine", 0.08);
  }
  function playDontKnowSound() {
    playAlmostSound();
  }
  function playClickSound() {
    playTone(700, 0.045, "triangle", 0.04);
  }

  let words = loadWords();
  let deck = randomSample(getAllWords(), SESSION_SIZE);
  let view = "home"; // "home" | "practice" | "dictionary" | "games"
  let editingIndex = null;
  let showAddForm = false;

  // practice session state
  let firstSide = "term"; // "term" | "definition"
  let order = [];
  let pos = 0;
  let side = "term"; // currently visible side for current card
  let practiceMode = "random"; // "random" | "missed"
  let score = { gotit: 0, almost: 0, dontknow: 0 };
  let results = {}; // original deck index -> "gotit" | "almost" | "dontknow" | "skipped"

  let bubbleGame = {
    score: 0,
    attempts: 0,
    streak: 0,
    answer: null,
    choices: [],
    selectedWord: null,
    feedback: "",
    feedbackType: "",
    locked: false,
    roundStartedAt: 0,
    elapsed: 0
  };

  let bubbleTimerId = null;
  let bubblePhysicsFrame = null;
  let bubblePhysicsBodies = [];

  const app = document.getElementById("app");

  function resetPracticeSession(indices) {
    order = indices ? indices.slice() : deck.map((_, i) => i);
    practiceMode = Array.isArray(indices) ? "missed" : "random";
    pos = 0;
    side = firstSide;
    score = { gotit: 0, almost: 0, dontknow: 0 };
    results = {};
  }

  function getResultItems(category) {
    return Object.entries(results)
      .filter(([, result]) => result === category)
      .map(([index]) => deck[Number(index)])
      .filter(Boolean);
  }

  function resultGroupHtml(title, items, className) {
    const itemMarkup = items.length
      ? items.map((item) => `
          <div class="result-item">
            <div class="result-word">${escapeHtml(item.word)}</div>
            <div class="result-definition">${escapeHtml(item.definition)}</div>
          </div>
        `).join("")
      : `<div class="result-empty">No words in this group.</div>`;

    return `
      <details class="result-group ${className}" ${items.length ? 'open' : ''}>
        <summary>${title} (${items.length})</summary>
        <div class="result-items">${itemMarkup}</div>
      </details>
    `;
  }

  function generateNewSession() {
    deck = randomSample(getAllWords(), SESSION_SIZE);
    resetPracticeSession();
  }

  function createBubbleRound() {
    const pool = getAllWords();
    if (pool.length < 4) {
      bubbleGame.answer = null;
      bubbleGame.choices = [];
      return;
    }

    const answer = pool[Math.floor(Math.random() * pool.length)];
    const decoys = randomSample(
      pool.filter((item) => item.word.toLowerCase() !== answer.word.toLowerCase()),
      3
    );

    bubbleGame.answer = answer;
    bubbleGame.choices = randomSample([answer, ...decoys], 4);
    bubbleGame.selectedWord = null;
    bubbleGame.feedback = "";
    bubbleGame.feedbackType = "";
    bubbleGame.locked = false;
    bubbleGame.elapsed = 0;
    bubbleGame.roundStartedAt = performance.now();
  }

  function stopBubbleTimer() {
    if (bubbleTimerId) {
      clearInterval(bubbleTimerId);
      bubbleTimerId = null;
    }
  }

  function stopBubblePhysics() {
    if (bubblePhysicsFrame) cancelAnimationFrame(bubblePhysicsFrame);
    bubblePhysicsFrame = null;
    bubblePhysicsBodies = [];
  }

  function startBubblePhysics(field) {
    stopBubblePhysics();
    const bubbles = [...field.querySelectorAll(".word-bubble")];
    if (!bubbles.length) return;

    const fieldWidth = field.clientWidth;
    const fieldHeight = field.clientHeight;
    const starts = [
      [0.08, 0.08], [0.72, 0.1], [0.12, 0.64], [0.7, 0.62]
    ];
    const speedFactor = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.35 : 1;

    bubblePhysicsBodies = bubbles.map((element, index) => {
      const size = element.offsetWidth;
      const angle = Math.random() * Math.PI * 2;
      const speed = (34 + Math.random() * 24) * speedFactor;
      const x = Math.min(fieldWidth - size, Math.max(0, starts[index][0] * fieldWidth));
      const y = Math.min(fieldHeight - size, Math.max(0, starts[index][1] * fieldHeight));
      element.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      return { element, x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size };
    });

    let lastTime = performance.now();
    const step = (now) => {
      const dt = Math.min((now - lastTime) / 1000, 0.032);
      lastTime = now;

      for (const body of bubblePhysicsBodies) {
        if (body.element.classList.contains("hit")) continue;
        body.x += body.vx * dt;
        body.y += body.vy * dt;
        if (body.x <= 0 || body.x + body.size >= fieldWidth) {
          body.x = Math.max(0, Math.min(fieldWidth - body.size, body.x));
          body.vx *= -1;
        }
        if (body.y <= 0 || body.y + body.size >= fieldHeight) {
          body.y = Math.max(0, Math.min(fieldHeight - body.size, body.y));
          body.vy *= -1;
        }
      }

      for (let i = 0; i < bubblePhysicsBodies.length; i++) {
        const a = bubblePhysicsBodies[i];
        if (a.element.classList.contains("hit")) continue;
        for (let j = i + 1; j < bubblePhysicsBodies.length; j++) {
          const b = bubblePhysicsBodies[j];
          if (b.element.classList.contains("hit")) continue;
          const dx = (b.x + b.size / 2) - (a.x + a.size / 2);
          const dy = (b.y + b.size / 2) - (a.y + a.size / 2);
          const distance = Math.hypot(dx, dy) || 0.001;
          const minimum = (a.size + b.size) / 2;
          if (distance >= minimum) continue;

          const nx = dx / distance;
          const ny = dy / distance;
          const overlap = minimum - distance;
          a.x -= nx * overlap / 2;
          a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2;
          b.y += ny * overlap / 2;
          const approachSpeed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (approachSpeed < 0) {
            a.vx += approachSpeed * nx;
            a.vy += approachSpeed * ny;
            b.vx -= approachSpeed * nx;
            b.vy -= approachSpeed * ny;
          }
        }
      }

      for (const body of bubblePhysicsBodies) {
        if (!body.element.classList.contains("hit")) {
          body.element.style.transform = `translate3d(${body.x}px, ${body.y}px, 0)`;
        }
      }
      if (view === "games" && field.isConnected) bubblePhysicsFrame = requestAnimationFrame(step);
    };
    bubblePhysicsFrame = requestAnimationFrame(step);
  }

  function startBubbleTimer() {
    stopBubbleTimer();
    if (bubbleGame.locked || view !== "games") return;

    const updateTimer = () => {
      const timer = document.getElementById("roundTimer");
      if (!timer || bubbleGame.locked || view !== "games") {
        stopBubbleTimer();
        return;
      }
      bubbleGame.elapsed = (performance.now() - bubbleGame.roundStartedAt) / 1000;
      timer.textContent = `${bubbleGame.elapsed.toFixed(1)}s`;
    };

    updateTimer();
    bubbleTimerId = setInterval(updateTimer, 100);
  }

  function resetBubbleGame() {
    stopBubbleTimer();
    bubbleGame.score = 0;
    bubbleGame.attempts = 0;
    bubbleGame.streak = 0;
    createBubbleRound();
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    side = firstSide;
  }

  resetPracticeSession();

  function render() {
    stopBubbleTimer();
    stopBubblePhysics();
    if (view === "home") {
      renderHome();
      return;
    }

    app.innerHTML = `
      <button class="back-home-btn" id="backHome">&#8249; Back to Home</button>
      <div id="viewRoot" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;"></div>

      view = "home";
      render();

    const root = document.getElementById("viewRoot");
    if (view === "practice") {
      renderPractice(root);
    } else if (view === "dictionary") {
      renderDictionary(root);
    } else if (view === "games") {
      renderGames(root);
    }
  }

    app.innerHTML = `
      <div class="home-view">

        </div>

        <div class="brand-bar">

              <rect x="8" y="3" width="13" height="15" rx="2" fill="var(--card-bg)" stroke="#0f6e56" stroke-width="1.8"></rect>
            </svg>
            Cardstack
          </span>
        </div>

        <div class="home-grid">
          <button class="home-card" id="goDictionary">
            <span class="home-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
                <path d="M3 5.5c3-1.2 6-1.2 9 0v14c-3-1.2-6-1.2-9 0z"></path>
                <path d="M21 5.5c-3-1.2-6-1.2-9 0v14c3-1.2 6-1.2 9 0z"></path>
              </svg>
            </span>
            <p class="home-card-title">Dictionary</p>
            <p class="home-card-body">Look up a word</p>
          </button>
          <button class="home-card hero" id="goPractice">
            <span class="home-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="2.5" y="7.5" width="13" height="13" rx="2.5"></rect>
                <path d="M8 4.5h11a2.5 2.5 0 0 1 2.5 2.5v11" stroke-linecap="round"></path>
              </svg>
            </span>
            <p class="home-card-title">Flashcards</p>
            <p class="home-card-body">Make and study decks</p>
          </button>
          <button class="home-card" id="goGames">
            <span class="home-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="2" y="7" width="20" height="11" rx="4"></rect>
                <path d="M6.5 10.5v4M4.5 12.5h4" stroke-linecap="round"></path>
                <circle cx="16" cy="11.5" r="1.3" fill="currentColor" stroke="none"></circle>
                <circle cx="18.5" cy="14" r="1.3" fill="currentColor" stroke="none"></circle>

          </button>
        </div>
      </div>
    `;

    app.querySelector("#goDictionary").addEventListener("click", () => {
      playClickSound();
      view = "dictionary";
      render();
    });
    app.querySelector("#goPractice").addEventListener("click", () => {
      playClickSound();
      view = "practice";
      resetPracticeSession();
      render();
    });
    app.querySelector("#goGames").addEventListener("click", () => {
      playClickSound();
      view = "games";
      if (!bubbleGame.answer) resetBubbleGame();
      render();
    });
  }

  function renderGames(root) {
    if (!bubbleGame.answer) createBubbleRound();

    if (!bubbleGame.answer) {
      root.innerHTML = `<div class="empty-state">Add at least four words in the Dictionary to play Bubble Shot.</div>`;
      return;
    }

    root.innerHTML = `
      <section class="bubble-game" aria-labelledby="bubbleGameTitle">
        <div class="game-heading">
          <div>
            <h2 id="bubbleGameTitle">Bubble Shot</h2>
            <p>Shoot the word that matches the definition.</p>
          </div>
          <div class="game-stats" aria-label="Game score">
            <div class="stat-pill"><strong id="gameScore">${bubbleGame.score}</strong><span>Score</span></div>
            <div class="stat-pill"><strong id="gameStreak">${bubbleGame.streak}</strong><span>Streak</span></div>
            <div class="stat-pill"><strong id="roundTimer">${bubbleGame.elapsed.toFixed(1)}s</strong><span>Time</span></div>
          </div>
        </div>

        <div class="definition-prompt">
          <div class="side-label">FIND THIS WORD</div>
          <p>${escapeHtml(bubbleGame.answer.definition)}</p>
        </div>

        <div class="bubble-field" aria-label="Word choices">
          ${bubbleGame.choices.map((choice, index) => {
            return `
              <button
                class="word-bubble"
                data-choice-index="${index}"
                ${bubbleGame.locked ? "disabled" : ""}
                aria-label="Shoot ${escapeHtml(choice.word)}"
              ><span class="bubble-word">${escapeHtml(choice.word)}</span><span class="pop-spray" aria-hidden="true">${"<i></i>".repeat(12)}</span></button>
            `;
          }).join("")}
          <div class="aim-hint">Aim and shoot</div>
        </div>

        <div class="game-feedback ${bubbleGame.feedbackType}" aria-live="polite">
          ${escapeHtml(bubbleGame.feedback)}
        </div>

        <div class="game-footer">
          <button class="small-btn" id="newBubbleGame">New game</button>
        </div>
      </section>
    `;

    startBubbleTimer();
    const bubbleField = root.querySelector(".bubble-field");
    startBubblePhysics(bubbleField);

    root.querySelectorAll(".word-bubble").forEach((button) => {
      button.addEventListener("click", () => {
        if (bubbleGame.locked) return;

        const choiceIndex = Number(button.getAttribute("data-choice-index"));
        const choice = bubbleGame.choices[choiceIndex];
        const isCorrect = choice.word === bubbleGame.answer.word;
        const elapsed = Math.max(0, (performance.now() - bubbleGame.roundStartedAt) / 1000);

        stopBubbleTimer();
        bubbleGame.locked = true;
        bubbleGame.attempts++;
        bubbleGame.selectedWord = choice.word;
        bubbleGame.elapsed = elapsed;

        if (isCorrect) {
          bubbleGame.streak++;
          const speedPoints = Math.max(100, Math.round(1000 - elapsed * 90));
          const streakBonus = Math.min((bubbleGame.streak - 1) * 25, 250);
          const pointsEarned = speedPoints + streakBonus;
          bubbleGame.score += pointsEarned;
          bubbleGame.feedback = `Bullseye! +${pointsEarned} points in ${elapsed.toFixed(1)}s.`;
          bubbleGame.feedbackType = "correct";
          playGotItSound();
        } else {
          bubbleGame.streak = 0;
          const pointsLost = Math.min(250, bubbleGame.score);
          bubbleGame.score = Math.max(0, bubbleGame.score - 250);
          bubbleGame.feedback = pointsLost
            ? `Wrong bubble: -${pointsLost} points. The answer is ${bubbleGame.answer.word}.`
            : `Wrong bubble. Your score stays at 0. The answer is ${bubbleGame.answer.word}.`;
          bubbleGame.feedbackType = "wrong";
          playDontKnowSound();
        }

        const answeredAttempt = bubbleGame.attempts;
        const field = root.querySelector(".bubble-field");
        const bubbleRect = button.getBoundingClientRect();
        const fieldRect = field.getBoundingClientRect();
        button.style.left = `${bubbleRect.left + bubbleRect.width / 2 - fieldRect.left - button.offsetWidth / 2}px`;
        button.style.top = `${bubbleRect.top + bubbleRect.height / 2 - fieldRect.top - button.offsetHeight / 2}px`;
        button.classList.add(isCorrect ? "correct" : "wrong", "hit");
        if (!isCorrect) {
          const correctIndex = bubbleGame.choices.findIndex((item) => item.word === bubbleGame.answer.word);
          root.querySelector(`.word-bubble[data-choice-index="${correctIndex}"]`)?.classList.add("answer-reveal");
        }
        field.classList.add("round-locked");
        root.querySelectorAll(".word-bubble").forEach((bubble) => bubble.setAttribute("aria-disabled", "true"));
        root.querySelector("#gameScore").textContent = bubbleGame.score;
        root.querySelector("#gameStreak").textContent = bubbleGame.streak;
        root.querySelector("#roundTimer").textContent = `${elapsed.toFixed(1)}s`;
        const feedback = root.querySelector(".game-feedback");
        feedback.className = `game-feedback ${bubbleGame.feedbackType}`;
        feedback.textContent = bubbleGame.feedback;
        setTimeout(() => {
          if (view === "games" && bubbleGame.locked && bubbleGame.attempts === answeredAttempt) {
            createBubbleRound();
            render();
          }
        }, 1500);
      });
    });

    root.querySelector("#newBubbleGame").addEventListener("click", () => {
      playClickSound();
      resetBubbleGame();
      render();
    });
  }

  function renderPractice(root) {
    if (deck.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p>No cards yet.</p>
          <p>Add some in "Dictionary" to start practicing.</p>
        </div>
      `;
      return;
    }

    root.innerHTML = "";

    const topbar = document.createElement("div");
    topbar.className = "practice-topbar";
    topbar.innerHTML = `
      <div class="side-toggle">
        <div class="side-toggle-btn ${firstSide === 'term' ? 'active' : ''}" id="termFirstBtn">Term first</div>
        <div class="side-toggle-btn ${firstSide === 'definition' ? 'active' : ''}" id="defFirstBtn">Definition first</div>
      </div>
    `;
    root.appendChild(topbar);
    topbar.querySelector("#termFirstBtn").addEventListener("click", () => {
      playClickSound();
      firstSide = "term";
      side = "term";
      render();
    });
    topbar.querySelector("#defFirstBtn").addEventListener("click", () => {
      playClickSound();
      firstSide = "definition";
      side = "definition";
      render();
    });

    if (pos >= order.length) {
      const skipped = Object.values(results).filter((result) => result === "skipped").length;
      const missedIndices = Object.keys(results)
        .filter((k) => results[k] !== "gotit")
        .map(Number);

      const done = document.createElement("div");
      done.className = "done";
      done.innerHTML = `
        <h2>Session complete!</h2>
        <p>Got it: ${score.gotit} &nbsp;|&nbsp; Almost: ${score.almost} &nbsp;|&nbsp; Didn't know: ${score.dontknow}</p>
        ${skipped > 0 ? `<p>Skipped: ${skipped}</p>` : ""}
        <button class="accent-btn restart-btn" id="restart">&#8635; Practice again</button>
        ${missedIndices.length > 0 ? `<button class="missed-btn" id="practiceMissed">Practice missed &amp; skipped (${missedIndices.length})</button>` : ""}
        <div class="results-review">
          <h3>Review your words</h3>
          ${resultGroupHtml("Didn't know", getResultItems("dontknow"), "dont-know-group")}
          ${resultGroupHtml("Almost got it", getResultItems("almost"), "almost-group")}
          ${resultGroupHtml("Got it", getResultItems("gotit"), "got-it-group")}
        </div>
      `;
      root.appendChild(done);
      done.querySelector("#restart").addEventListener("click", () => {
        playClickSound();
        resetPracticeSession();
        render();
      });
      const missedBtn = done.querySelector("#practiceMissed");
      if (missedBtn) {
        missedBtn.addEventListener("click", () => {
          playClickSound();
          resetPracticeSession(missedIndices);
          render();
        });
      }
      return;
    }

    const current = deck[order[pos]];
    const progressPct = Math.round((pos / order.length) * 100);
    const frontIsTerm = firstSide === "term";
    const frontLabel = frontIsTerm ? "TERM" : "DEFINITION";
    const frontValue = frontIsTerm ? current.word : current.definition;
    const backLabel = frontIsTerm ? "DEFINITION" : "TERM";
    const backValue = frontIsTerm ? current.definition : current.word;

    const sessionActions = document.createElement("div");
    sessionActions.className = "session-actions";
    sessionActions.innerHTML = `
      <div class="progress-label">${pos + 1} / ${order.length} ${practiceMode === "missed" ? "missed &amp; skipped words" : "random words"}</div>
      <button class="small-btn" id="newSessionBtn">New 10</button>
    `;
    root.appendChild(sessionActions);
    sessionActions.querySelector("#newSessionBtn").addEventListener("click", () => {
      playClickSound();
      generateNewSession();
      render();
    });

    const progressTrack = document.createElement("div");
    progressTrack.className = "progress-track";
    progressTrack.innerHTML = `<div class="progress-fill" style="width:${progressPct}%"></div>`;
    root.appendChild(progressTrack);

    const scene = document.createElement("div");
    scene.className = "card-scene";
    scene.tabIndex = 0;
    scene.setAttribute("role", "button");
    scene.setAttribute("aria-label", "Flip vocabulary card");
    scene.innerHTML = `
      <div class="card-inner ${side !== firstSide ? 'flip' : ''}" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="side-label">${frontLabel}</div>
            <div class="${frontIsTerm ? 'word' : 'definition'}">${escapeHtml(frontValue)}</div>
            <div class="hint">Tap to flip</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="side-label">${backLabel}</div>
            <div class="${frontIsTerm ? 'definition' : 'word'}">${escapeHtml(backValue)}</div>
            <div class="hint">Tap to flip back</div>
          </div>
        </div>
      </div>
    `;
    root.appendChild(scene);

    function flipCard() {
      playFlipSound();
      side = side === "term" ? "definition" : "term";
      const inner = document.getElementById("cardInner");
      if (inner) inner.classList.toggle("flip");
      renderRateRow();
    }

    scene.addEventListener("click", flipCard);
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });

    const rateRowContainer = document.createElement("div");
    rateRowContainer.id = "rateRowContainer";
    rateRowContainer.style.width = "100%";
    root.appendChild(rateRowContainer);
    renderRateRow();

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <button id="prevBtn">Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next</button>
    `;
    root.appendChild(navRow);
    navRow.querySelector("#prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      pos = Math.max(0, pos - 1);
      side = firstSide;
      render();
    });
    navRow.querySelector("#shuffleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      shuffleOrder();
      render();
    });
    navRow.querySelector("#nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      playClickSound();
      if (!(order[pos] in results)) results[order[pos]] = "skipped";
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderRateRow() {
    const container = document.getElementById("rateRowContainer");
    if (!container) return;
    if (side === firstSide) {
      container.innerHTML = "";
      return;
    }
    container.innerHTML = `
      <div class="rate-row">
        <button class="dont-know" id="dontKnow">Didn't know</button>
        <button class="almost-btn" id="almost">Almost got it</button>
        <button class="know" id="gotit">Got it</button>
      </div>
    `;
    container.querySelector("#dontKnow").addEventListener("click", (e) => {
      e.stopPropagation();
      playDontKnowSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "dontknow";
      score.dontknow++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#almost").addEventListener("click", (e) => {
      e.stopPropagation();
      playAlmostSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "almost";
      score.almost++;
      pos++;
      side = firstSide;
      render();
    });
    container.querySelector("#gotit").addEventListener("click", (e) => {
      e.stopPropagation();
      playGotItSound();
      const previous = results[order[pos]];
      if (previous && previous !== "skipped") score[previous]--;
      results[order[pos]] = "gotit";
      score.gotit++;
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderDictionary(root) {
    const allWords = getAllWords();
    const editingWord = editingIndex === null ? null : words[editingIndex];

    root.innerHTML = `
      <div class="manage">
        <div class="dictionary-header">
          <h2>Dictionary</h2>
          <p>${allWords.length} words &mdash; search, add, edit, or remove any of them.</p>
        </div>
        <div class="dictionary-toolbar">
          <input
            class="dictionary-search"
            id="dictionarySearch"
            type="search"
            placeholder="Search words or definitions"
            aria-label="Search dictionary"
          />
          <button class="small-btn" id="toggleAddBtn">${showAddForm ? 'Close' : '+ Add word'}</button>
        </div>
        ${showAddForm ? `
          <div class="add-form">
            <strong>${editingWord ? 'Edit word' : 'Add a word'}</strong>
            <input type="text" id="newWord" placeholder="Word" />
            <textarea id="newDef" placeholder="Definition" rows="2"></textarea>
            <div class="form-actions">
              <button class="cancel-btn" id="cancelEditBtn">Cancel</button>
              <button class="accent-btn" id="addBtn">${editingWord ? 'Save changes' : 'Add word'}</button>
            </div>
          </div>
        ` : ""}
        <div class="deck-list" id="deckList"></div>
      </div>
    `;

    root.querySelector("#toggleAddBtn").addEventListener("click", () => {
      playClickSound();
      showAddForm = !showAddForm;
      if (!showAddForm) editingIndex = null;
      render();
    });

    if (showAddForm) {
      const wordInput = root.querySelector("#newWord");
      const defInput = root.querySelector("#newDef");
      if (editingWord) {
        wordInput.value = editingWord.word;
        defInput.value = editingWord.definition;
      }
      root.querySelector("#cancelEditBtn").addEventListener("click", () => {
        playClickSound();
        showAddForm = false;
        editingIndex = null;
        render();
      });
      root.querySelector("#addBtn").addEventListener("click", () => {
        const word = wordInput.value.trim();
        const definition = defInput.value.trim();
        if (!word || !definition) return;
        const duplicate = words.some(
          (item, i) => i !== editingIndex && item.word.toLowerCase() === word.toLowerCase()
        );
        if (duplicate) {
          wordInput.setCustomValidity("That word is already in the dictionary.");
          wordInput.reportValidity();
          return;
        }
        playClickSound();
        if (editingIndex === null) {
          words.push({ word, definition });
        } else {
          words[editingIndex] = { word, definition };
        }
        saveWords(words);
        showAddForm = false;
        editingIndex = null;
        generateNewSession();
        render();
      });
    }

    const search = root.querySelector("#dictionarySearch");
    const list = root.querySelector("#deckList");

    function drawList(query = "") {
      const normalized = query.trim().toLowerCase();
      const matches = allWords.filter((item) =>
        !normalized || item.word.toLowerCase().includes(normalized) ||
        item.definition.toLowerCase().includes(normalized)
      );

      if (matches.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching words found.</div>`;
        return;
      }

      list.innerHTML = matches.map((item) => {
        const realIndex = words.indexOf(item);
        return `
          <div class="deck-item">
            <div class="deck-item-text">
              <div class="deck-item-word">${escapeHtml(item.word)}</div>
              <div class="deck-item-def">${escapeHtml(item.definition)}</div>
            </div>
            <div class="deck-item-actions">
              <button class="edit-btn" data-index="${realIndex}" aria-label="Edit ${escapeHtml(item.word)}">Edit</button>
              <button class="delete-btn" data-index="${realIndex}" aria-label="Delete ${escapeHtml(item.word)}">&times;</button>
            </div>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          editingIndex = parseInt(btn.getAttribute("data-index"), 10);
          showAddForm = true;
          render();
          document.getElementById("newWord").focus();
        });
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          playClickSound();
          const i = parseInt(btn.getAttribute("data-index"), 10);
          words.splice(i, 1);
          if (editingIndex === i) {
            editingIndex = null;
            showAddForm = false;
          } else if (editingIndex !== null && editingIndex > i) {
            editingIndex--;
          }
          saveWords(words);
          generateNewSession();
          render();
        });
      });
    }

    search.addEventListener("input", () => drawList(search.value));
    drawList();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>

</body>
</html>
