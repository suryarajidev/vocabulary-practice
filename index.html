<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Practice</title>
<style>
  :root {
    --bg: #f0ebdd;
    --text: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #fdfcf9;
    --border: #e5e1d3;
    --accent: #2563eb;
    --teal: #0d9488;
    --good: #16a34a;
    --almost: #b45309;
    --bad: #dc2626;
  }

  * { box-sizing: border-box; }

  button,
  .tab,
  .side-toggle-btn,
  .card-scene {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  .tab,
  .side-toggle-btn {
    transition: transform 0.16s ease, box-shadow 0.16s ease,
      background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    transform: translateY(0) scale(1);
  }

  button:hover,
  .tab:hover,
  .side-toggle-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(37, 99, 235, 0.14);
  }

  button:active,
  .tab:active,
  .side-toggle-btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.12);
    transition-duration: 0.07s;
  }

  button:focus-visible,
  .tab:focus-visible,
  .side-toggle-btn:focus-visible,
  .card-scene:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.35);
    outline-offset: 3px;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: auto;
  }

  .tabs {
    width: 100%;
    display: flex;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border: 0;
    background: transparent;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  .practice-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .side-toggle {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }

  .side-toggle-btn {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }

  .side-toggle-btn.active {
    background: var(--teal);
    color: white;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 13px;
    color: var(--muted);
    align-self: center;
  }

  .card-scene {
    width: 100%;
    min-height: 280px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .card-scene:hover {
    transform: translateY(-3px);
  }

  .card-scene:active {
    transform: translateY(0) scale(0.99);
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 280px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }

  .card-inner.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    backface-visibility: hidden;
    user-select: none;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    border-top: 4px solid transparent;
  }

  .card-front {
    background: var(--card-bg);
    border-top-color: var(--accent);
  }

  .card-back {
    background: #e6f7f3;
    border-top-color: var(--teal);
    transform: rotateY(180deg);
  }

  .side-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .word {
    font-size: 32px;
    font-weight: 700;
  }

  .definition {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.4;
  }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
  }

  .rate-row {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  .rate-row button {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .dont-know {
    background: #fee2e2;
    color: var(--bad);
  }

  .almost-btn {
    background: #fef3c7;
    color: var(--almost);
  }

  .know {
    background: #dcfce7;
    color: var(--good);
  }

  .nav-row {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  .nav-row button {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .accent-btn {
    background: var(--accent);
    color: white;
    border: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 0;
    border-radius: 10px;
    cursor: pointer;
  }

  .done {
    text-align: center;
  }

  .done h2 {
    margin-bottom: 8px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }

  /* Manage deck view */
  .manage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .add-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .add-form input,
  .add-form textarea {
    font-size: 15px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    resize: vertical;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .deck-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .deck-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .deck-item-word {
    font-weight: 700;
    font-size: 15px;
  }

  .deck-item-def {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    color: var(--bad);
    font-size: 18px;
    padding: 4px 10px;
    line-height: 1;
    border: none;
    cursor: pointer;
  }

  .deck-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .edit-btn {
    background: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
  }

  .form-actions {
    display: flex;
    gap: 8px;
  }

  .form-actions button {
    flex: 1;
  }

  .cancel-btn {
    background: var(--card-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .deck-count {
    font-size: 13px;
    color: var(--muted);
  }

  /* Dictionary view */
  .dictionary-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .dictionary-header h2 {
    margin: 0 0 4px;
  }

  .dictionary-header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .dictionary-search {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    outline: none;
  }

  .dictionary-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 3px;
  }

  .dictionary-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .dictionary-item:hover {
    transform: translateX(3px);
    border-color: rgba(37, 99, 235, 0.38);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }

  .dictionary-word {
    font-weight: 750;
    margin-bottom: 4px;
  }

  .dictionary-definition {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  .session-actions {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .small-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--accent);
    border-radius: 9px;
    padding: 9px 12px;
    font-weight: 700;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
  const STORAGE_KEY = "vocabPracticeCustomWords";
  const LEGACY_STORAGE_KEY = "vocabPracticeDeck";
  const SESSION_SIZE = 10;

  const dictionary = [
    { word: "Ephemeral", definition: "Lasting for a very short time." },
    { word: "Ubiquitous", definition: "Present, appearing, or found everywhere." },
    { word: "Candid", definition: "Truthful and straightforward; frank." },
    { word: "Meticulous", definition: "Showing great attention to detail; very careful." },
    { word: "Resilient", definition: "Able to recover quickly from difficulties." },
    { word: "Ambiguous", definition: "Open to more than one interpretation; unclear." },
    { word: "Pragmatic", definition: "Dealing with things sensibly and realistically." },
    { word: "Eloquent", definition: "Fluent and persuasive in speaking or writing." },
    { word: "Tenacious", definition: "Persistent; not easily giving up." },
    { word: "Superfluous", definition: "Unnecessary; more than what is required." },
    { word: "Benevolent", definition: "Well-meaning and kindly." },
    { word: "Conundrum", definition: "A confusing and difficult problem or question." },
    { word: "Diligent", definition: "Showing careful and persistent effort." },
    { word: "Empathy", definition: "The ability to understand and share another person's feelings." },
    { word: "Fortuitous", definition: "Happening by chance, often with a fortunate result." },
    { word: "Gregarious", definition: "Fond of company; sociable." },
    { word: "Impeccable", definition: "In accordance with the highest standards; faultless." },
    { word: "Juxtapose", definition: "To place things close together for comparison or contrast." },
    { word: "Lucid", definition: "Expressed clearly; easy to understand." },
    { word: "Magnanimous", definition: "Generous or forgiving, especially toward a rival." },
    { word: "Nuance", definition: "A subtle distinction or variation." },
    { word: "Obsolete", definition: "No longer produced or used; out of date." },
    { word: "Plausible", definition: "Seeming reasonable or probable." },
    { word: "Quintessential", definition: "Representing the most perfect example of something." },
    { word: "Scrutinize", definition: "To examine closely and carefully." },
    { word: "Tranquil", definition: "Free from disturbance; calm." },
    { word: "Unprecedented", definition: "Never done or known before." },
    { word: "Venerable", definition: "Respected because of age, wisdom, or character." },
    { word: "Whimsical", definition: "Playfully unusual or imaginative." },
    { word: "Zealous", definition: "Showing energetic enthusiasm for a cause or goal." },
    { word: "Amiable", definition: "Friendly and pleasant in manner." },
    { word: "Clandestine", definition: "Kept secret, especially because it is illicit." },
    { word: "Discerning", definition: "Showing good judgment and understanding." },
    { word: "Exuberant", definition: "Full of energy, excitement, and cheerfulness." },
    { word: "Frugal", definition: "Careful to avoid unnecessary spending or waste." },
    { word: "Hinder", definition: "To create difficulties that slow or obstruct progress." },
    { word: "Inevitable", definition: "Certain to happen; unavoidable." },
    { word: "Novice", definition: "A person new to or inexperienced in a field." },
    { word: "Paradox", definition: "A seemingly contradictory statement that may still be true." },
    { word: "Sporadic", definition: "Occurring at irregular intervals." },
    { word: "Versatile", definition: "Able to adapt to many different functions or activities." }
  ];

  function loadCustomWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);

      const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacyRaw) {
        const builtInWords = new Set(dictionary.map((item) => item.word.toLowerCase()));
        const migrated = JSON.parse(legacyRaw).filter(
          (item) => item && item.word && item.definition && !builtInWords.has(item.word.toLowerCase())
        );
        saveCustomWords(migrated);
        return migrated;
      }
    } catch (e) {}
    return [];
  }

  function saveCustomWords(words) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  function getAllWords() {
    const unique = new Map();
    [...dictionary, ...customWords].forEach((item) => {
      unique.set(item.word.toLowerCase(), item);
    });
    return Array.from(unique.values()).sort((a, b) => a.word.localeCompare(b.word));
  }

  function randomSample(items, count) {
    const shuffled = items.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, Math.min(count, shuffled.length));
  }

  let customWords = loadCustomWords();
  let deck = randomSample(getAllWords(), SESSION_SIZE);
  let view = "practice"; // "practice" | "dictionary" | "manage"
  let editingIndex = null;

  // practice session state
  let firstSide = "term"; // "term" | "definition"
  let order = [];
  let pos = 0;
  let side = "term"; // currently visible side for current card
  let score = { gotit: 0, almost: 0, dontknow: 0 };

  const app = document.getElementById("app");

  function resetPracticeSession() {
    order = deck.map((_, i) => i);
    pos = 0;
    side = firstSide;
    score = { gotit: 0, almost: 0, dontknow: 0 };
  }

  function generateNewSession() {
    deck = randomSample(getAllWords(), SESSION_SIZE);
    resetPracticeSession();
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    side = firstSide;
  }

  resetPracticeSession();

  function render() {
    app.innerHTML = `
      <div class="tabs" role="tablist" aria-label="Vocabulary sections">
        <button class="tab ${view === 'practice' ? 'active' : ''}" id="tabPractice" role="tab" aria-selected="${view === 'practice'}">Practice</button>
        <button class="tab ${view === 'dictionary' ? 'active' : ''}" id="tabDictionary" role="tab" aria-selected="${view === 'dictionary'}">Dictionary</button>
        <button class="tab ${view === 'manage' ? 'active' : ''}" id="tabManage" role="tab" aria-selected="${view === 'manage'}">My Words</button>
      </div>
      <div id="viewRoot" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;"></div>
    `;

    document.getElementById("tabPractice").addEventListener("click", () => {
      view = "practice";
      resetPracticeSession();
      render();
    });
    document.getElementById("tabManage").addEventListener("click", () => {
      view = "manage";
      render();
    });
    document.getElementById("tabDictionary").addEventListener("click", () => {
      view = "dictionary";
      render();
    });

    const root = document.getElementById("viewRoot");
    if (view === "practice") {
      renderPractice(root);
    } else if (view === "dictionary") {
      renderDictionary(root);
    } else {
      renderManage(root);
    }
  }

  function renderPractice(root) {
    if (deck.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <p>No cards yet.</p>
          <p>Add some in "Manage Deck" to start practicing.</p>
        </div>
      `;
      return;
    }

    root.innerHTML = "";

    const topbar = document.createElement("div");
    topbar.className = "practice-topbar";
    topbar.innerHTML = `
      <div class="side-toggle">
        <div class="side-toggle-btn ${firstSide === 'term' ? 'active' : ''}" id="termFirstBtn">Term first</div>
        <div class="side-toggle-btn ${firstSide === 'definition' ? 'active' : ''}" id="defFirstBtn">Definition first</div>
      </div>
    `;
    root.appendChild(topbar);
    topbar.querySelector("#termFirstBtn").addEventListener("click", () => {
      firstSide = "term";
      side = "term";
      render();
    });
    topbar.querySelector("#defFirstBtn").addEventListener("click", () => {
      firstSide = "definition";
      side = "definition";
      render();
    });

    if (pos >= order.length) {
      const totalRated = score.gotit + score.almost + score.dontknow;
      const skipped = deck.length - totalRated;
      const done = document.createElement("div");
      done.className = "done";
      done.innerHTML = `
        <h2>Done!</h2>
        <p>Got it: ${score.gotit} &nbsp;|&nbsp; Almost: ${score.almost} &nbsp;|&nbsp; Didn't know: ${score.dontknow}</p>
        ${skipped > 0 ? `<p>Skipped: ${skipped}</p>` : ""}
        <button class="accent-btn" id="restart">Practice again</button>
      `;
      root.appendChild(done);
      done.querySelector("#restart").addEventListener("click", () => {
        resetPracticeSession();
        render();
      });
      return;
    }

    const current = deck[order[pos]];
    const progressPct = Math.round((pos / order.length) * 100);
    const frontIsTerm = firstSide === "term";
    const frontLabel = frontIsTerm ? "TERM" : "DEFINITION";
    const frontValue = frontIsTerm ? current.word : current.definition;
    const backLabel = frontIsTerm ? "DEFINITION" : "TERM";
    const backValue = frontIsTerm ? current.definition : current.word;

    const sessionActions = document.createElement("div");
    sessionActions.className = "session-actions";
    sessionActions.innerHTML = `
      <div class="progress-label">${pos + 1} / ${order.length} random words</div>
      <button class="small-btn" id="newSessionBtn">New 10</button>
    `;
    root.appendChild(sessionActions);
    sessionActions.querySelector("#newSessionBtn").addEventListener("click", () => {
      generateNewSession();
      render();
    });

    const progressTrack = document.createElement("div");
    progressTrack.className = "progress-track";
    progressTrack.innerHTML = `<div class="progress-fill" style="width:${progressPct}%"></div>`;
    root.appendChild(progressTrack);

    const scene = document.createElement("div");
    scene.className = "card-scene";
    scene.tabIndex = 0;
    scene.setAttribute("role", "button");
    scene.setAttribute("aria-label", "Flip vocabulary card");
    scene.innerHTML = `
      <div class="card-inner ${side !== firstSide ? 'flip' : ''}" id="cardInner">
        <div class="card-face card-front">
          <div>
            <div class="side-label">${frontLabel}</div>
            <div class="${frontIsTerm ? 'word' : 'definition'}">${escapeHtml(frontValue)}</div>
            <div class="hint">Tap to flip</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="side-label">${backLabel}</div>
            <div class="${frontIsTerm ? 'definition' : 'word'}">${escapeHtml(backValue)}</div>
            <div class="hint">Tap to flip back</div>
          </div>
        </div>
      </div>
    `;
    root.appendChild(scene);
    scene.addEventListener("click", () => {
      side = side === "term" ? "definition" : "term";
      render();
    });
    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        side = side === "term" ? "definition" : "term";
        render();
      }
    });

    if (side === "definition") {
      const rateRow = document.createElement("div");
      rateRow.className = "rate-row";
      rateRow.innerHTML = `
        <button class="dont-know" id="dontKnow">Didn't know</button>
        <button class="almost-btn" id="almost">Almost</button>
        <button class="know" id="gotit">Got it</button>
      `;
      root.appendChild(rateRow);
      rateRow.querySelector("#dontKnow").addEventListener("click", (e) => {
        e.stopPropagation();
        score.dontknow++;
        pos++;
        side = firstSide;
        render();
      });
      rateRow.querySelector("#almost").addEventListener("click", (e) => {
        e.stopPropagation();
        score.almost++;
        pos++;
        side = firstSide;
        render();
      });
      rateRow.querySelector("#gotit").addEventListener("click", (e) => {
        e.stopPropagation();
        score.gotit++;
        pos++;
        side = firstSide;
        render();
      });
    }

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <button id="prevBtn">Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="nextBtn">Next</button>
    `;
    root.appendChild(navRow);
    navRow.querySelector("#prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      pos = Math.max(0, pos - 1);
      side = firstSide;
      render();
    });
    navRow.querySelector("#shuffleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      shuffleOrder();
      render();
    });
    navRow.querySelector("#nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      pos++;
      side = firstSide;
      render();
    });
  }

  function renderManage(root) {
    const editingWord = editingIndex === null ? null : customWords[editingIndex];
    root.innerHTML = `
      <div class="manage">
        <div class="dictionary-header">
          <h2>My Words</h2>
          <p>Add your own words to the built-in dictionary and future random sessions.</p>
        </div>
        <div class="add-form">
          <strong>${editingWord ? 'Edit word' : 'Add a word'}</strong>
          <input type="text" id="newWord" placeholder="Word" />
          <textarea id="newDef" placeholder="Definition" rows="2"></textarea>
          <div class="form-actions">
            ${editingWord ? '<button class="cancel-btn" id="cancelEditBtn">Cancel</button>' : ''}
            <button class="accent-btn" id="addBtn">${editingWord ? 'Save changes' : 'Add word'}</button>
          </div>
        </div>

        <div class="deck-count">${customWords.length} custom word${customWords.length === 1 ? '' : 's'}</div>

        <div class="deck-list" id="deckList"></div>
      </div>
    `;

    const list = root.querySelector("#deckList");
    if (customWords.length === 0) {
      list.innerHTML = `<div class="empty-state">No custom words yet. Add one above or explore the Dictionary tab.</div>`;
    } else {
      customWords.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "deck-item";
        row.innerHTML = `
          <div class="deck-item-text">
            <div class="deck-item-word">${escapeHtml(item.word)}</div>
            <div class="deck-item-def">${escapeHtml(item.definition)}</div>
          </div>
          <div class="deck-item-actions">
            <button class="edit-btn" data-index="${i}" aria-label="Edit ${escapeHtml(item.word)}">Edit</button>
            <button class="delete-btn" data-index="${i}" aria-label="Delete ${escapeHtml(item.word)}">&times;</button>
          </div>
        `;
        list.appendChild(row);
      });

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          editingIndex = parseInt(btn.getAttribute("data-index"), 10);
          render();
          document.getElementById("newWord").focus();
        });
      });

      list.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-index"), 10);
          customWords.splice(i, 1);
          if (editingIndex === i) editingIndex = null;
          else if (editingIndex !== null && editingIndex > i) editingIndex--;
          saveCustomWords(customWords);
          generateNewSession();
          render();
        });
      });
    }

    const wordInput = root.querySelector("#newWord");
    const defInput = root.querySelector("#newDef");
    if (editingWord) {
      wordInput.value = editingWord.word;
      defInput.value = editingWord.definition;
      root.querySelector("#cancelEditBtn").addEventListener("click", () => {
        editingIndex = null;
        render();
      });
    }

    root.querySelector("#addBtn").addEventListener("click", () => {
      const word = wordInput.value.trim();
      const definition = defInput.value.trim();
      if (!word || !definition) return;
      const duplicate = getAllWords().some((item) => {
        const isCurrentEdit = editingIndex !== null && customWords[editingIndex] === item;
        return !isCurrentEdit && item.word.toLowerCase() === word.toLowerCase();
      });
      if (duplicate) {
        wordInput.setCustomValidity("That word is already in the dictionary.");
        wordInput.reportValidity();
        return;
      }
      if (editingIndex === null) {
        customWords.push({ word, definition });
      } else {
        customWords[editingIndex] = { word, definition };
        editingIndex = null;
      }
      saveCustomWords(customWords);
      generateNewSession();
      render();
    });
  }

  function renderDictionary(root) {
    const allWords = getAllWords();
    root.innerHTML = `
      <div class="dictionary-view">
        <div class="dictionary-header">
          <h2>Dictionary</h2>
          <p>${allWords.length} words available. Ten are selected randomly whenever the site loads.</p>
        </div>
        <input
          class="dictionary-search"
          id="dictionarySearch"
          type="search"
          placeholder="Search words or definitions"
          aria-label="Search dictionary"
        />
        <div class="dictionary-list" id="dictionaryList"></div>
      </div>
    `;

    const search = root.querySelector("#dictionarySearch");
    const list = root.querySelector("#dictionaryList");

    function drawDictionary(query = "") {
      const normalized = query.trim().toLowerCase();
      const matches = allWords.filter((item) =>
        !normalized || item.word.toLowerCase().includes(normalized) ||
        item.definition.toLowerCase().includes(normalized)
      );

      if (matches.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching words found.</div>`;
        return;
      }

      list.innerHTML = matches.map((item) => `
        <article class="dictionary-item">
          <div class="dictionary-word">${escapeHtml(item.word)}</div>
          <div class="dictionary-definition">${escapeHtml(item.definition)}</div>
        </article>
      `).join("");
    }

    search.addEventListener("input", () => drawDictionary(search.value));
    drawDictionary();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>

</body>
</html>
